version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  # Keeps the digest-pinned Alpine base image in Dockerfile current.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
