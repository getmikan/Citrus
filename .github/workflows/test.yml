name: Test
on:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "site/**"
      - ".github/workflows/pages.yml"
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      matrix:
        # Pull requests and pushes: Linux and Windows. Tags and manual runs: every OS.
        # Go 1.26 is the minimum (go.mod) and the only version tested.
        include: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '[{"os":"ubuntu-latest","go-version":"1.26"},{"os":"windows-latest","go-version":"1.26"},{"os":"macos-latest","go-version":"1.26"},{"os":"ubuntu-24.04-arm","go-version":"1.26"},{"os":"windows-11-arm","go-version":"1.26"},{"os":"macos-26-intel","go-version":"1.26"}]' || '[{"os":"ubuntu-latest","go-version":"1.26"},{"os":"windows-latest","go-version":"1.26"}]') }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      # Fix mingw trying to be smart and converting paths https://github.com/moby/moby/issues/24029#issuecomment-250412919
      MSYS_NO_PATHCONV: true
      # Skip citrus inbound interop test
      SKIP_INTEROP_TEST: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        run: bash .github/scripts/setup-go.sh "${{ matrix.go-version }}"

      # setup-go cached these; the pinned toolchain does not, so restore them here.
      - name: Locate Go caches
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"

      - name: Cache Go modules and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/go-toolchains.txt', 'go.sum') }}
          restore-keys: go-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Go installation
        run: go version

      - name: Verify Go env
        run: go env

      - name: Remove inbound test for macOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          rm -rf listener/inbound/*_test.go

      - name: Test
        run: go test ./... -v -count=1

      - name: Test with tag with_gvisor
        run: go test ./... -v -count=1 -tags "with_gvisor"
  race:
    # Race detector on the packages that are race-clean today, Linux only.
    # Excluded:
    #   - listener/inbound: red under -race until the smux fork fix lands, and
    #     the ResTLS races there are not ours to fix.
    #   - everything else not listed: not yet checked under -race; add a
    #     package here once `go test -race` passes on it.
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1 # -race needs cgo
      GOTOOLCHAIN: local
      SKIP_INTEROP_TEST: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        run: bash .github/scripts/setup-go.sh 1.26

      - name: Locate Go caches
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"

      - name: Cache Go modules and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: go-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/go-toolchains.txt', 'go.sum') }}
          restore-keys: go-race-${{ runner.os }}-${{ runner.arch }}-

      - name: Test with -race
        run: >-
          go test -race -count=1 -timeout 15m
          ./transport/xhttp/...
          ./transport/v2ray/...
          ./transport/vless/...
          ./common/...
          ./tunnel/...
          ./listener/sing/...
          ./adapter/...
