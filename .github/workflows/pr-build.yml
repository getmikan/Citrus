name: PR Build
# Cross-compiles the main platforms in one job, so a pull request learns in minutes
# whether it builds everywhere. The full release build (Build) runs on pushes to
# dev and main and on tags.
on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        id: setup_go
        continue-on-error: true
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Wait before retrying the Go download
        if: ${{ steps.setup_go.outcome == 'failure' }}
        run: sleep 30

      - name: Set up Go (retry)
        if: ${{ steps.setup_go.outcome == 'failure' }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Build
        run: |
          set -e
          targets="linux/amd64 linux/arm64 linux/arm linux/386 linux/mips linux/mipsle linux/riscv64 linux/loong64 \
                   windows/amd64 windows/arm64 windows/386 darwin/amd64 darwin/arm64 freebsd/amd64 android/arm64"
          failed=""
          for t in $targets; do
            os=${t%/*}; arch=${t#*/}
            echo "::group::$t"
            if GOOS=$os GOARCH=$arch go build -trimpath -tags with_gvisor -o /dev/null .; then
              echo "ok $t"
            else
              failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::build failed for:$failed"
            exit 1
          fi
