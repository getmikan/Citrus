name: Xray interop
on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "transport/**"
      - "component/tls/**"
      - "component/ech/**"
      - "listener/**"
      - "adapter/outbound/**"
      - "hub/route/**"
      - "tunnel/statistic/**"
      - "go.mod"
      - "go.sum"
      - "test/interop/**"
      - ".github/workflows/interop.yml"
  push:
    branches:
      - dev
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned Xray-core release. To bump: change both values; the hash is the
  # SHA2-256 line of Xray-linux-64.zip.dgst on the release page.
  XRAY_VERSION: v26.10.10
  XRAY_SHA256: 72a5fde819713a103c6fc26a87aa025c1518c918a34eba4bc38d64dc0728e5d9

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        run: bash .github/scripts/setup-go.sh 1.26

      - name: Verify Go installation
        run: go version

      - name: Download Xray-core
        run: |
          set -euo pipefail
          base="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}"
          mkdir -p "$RUNNER_TEMP/xray"
          cd "$RUNNER_TEMP/xray"
          curl -fsSL --retry 3 --retry-delay 5 -o Xray-linux-64.zip "$base/Xray-linux-64.zip"
          curl -fsSL --retry 3 --retry-delay 5 -o Xray-linux-64.zip.dgst "$base/Xray-linux-64.zip.dgst"
          dgst=$(sed -n 's/^SHA2-256= *\([0-9a-f]\{64\}\).*/\1/p' Xray-linux-64.zip.dgst)
          actual=$(sha256sum Xray-linux-64.zip | cut -d' ' -f1)
          echo "pinned: $XRAY_SHA256"
          echo "dgst:   $dgst"
          echo "actual: $actual"
          if [ -z "$dgst" ] || [ "$actual" != "$dgst" ] || [ "$actual" != "$XRAY_SHA256" ]; then
            echo "::error::Xray-linux-64.zip SHA256 mismatch"
            exit 1
          fi
          unzip -q Xray-linux-64.zip xray
          chmod +x xray
          ./xray version
          echo "XRAY_BIN=$RUNNER_TEMP/xray/xray" >> "$GITHUB_ENV"

      - name: Build Citrus
        run: |
          go build -trimpath -o "$RUNNER_TEMP/citrus" .
          echo "CITRUS_BIN=$RUNNER_TEMP/citrus" >> "$GITHUB_ENV"

      - name: Vet
        working-directory: test/interop
        run: go vet -tags interop ./...

      - name: Interop tests
        working-directory: test/interop
        env:
          INTEROP_LOG_DIR: ${{ runner.temp }}/interop-logs
        run: go test -tags interop -v -count=1 -timeout 10m ./...

      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-logs
          path: ${{ runner.temp }}/interop-logs
          if-no-files-found: ignore
          retention-days: 14

  # Upstream mihomo release (the core inside Mikan, ClashFest, Clash Verge and
  # other clients) -> Citrus server, for every inbound those clients can reach.
  # To bump a version: change it and its hash, the sha256 digest GitHub shows
  # for mihomo-linux-amd64-<version>.gz on the release page.
  interop-mihomo:
    name: interop-mihomo (${{ matrix.mihomo }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mihomo: v1.19.32 # the version the panel targets, latest stable
            sha256: 8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10
          - mihomo: v1.19.31 # the one before it, still in the wild
            sha256: d5e74bbddbdfff49a1aef7775bf5911da59f0d7196ed509a0ac914b3653dd5f1
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        run: bash .github/scripts/setup-go.sh 1.26

      - name: Verify Go installation
        run: go version

      - name: Download upstream mihomo
        env:
          MIHOMO_VERSION: ${{ matrix.mihomo }}
          MIHOMO_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          file="mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          mkdir -p "$RUNNER_TEMP/mihomo"
          cd "$RUNNER_TEMP/mihomo"
          curl -fsSL --retry 3 --retry-delay 5 -o "$file" \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/$file"
          actual=$(sha256sum "$file" | cut -d' ' -f1)
          echo "pinned: $MIHOMO_SHA256"
          echo "actual: $actual"
          if [ "$actual" != "$MIHOMO_SHA256" ]; then
            echo "::error::$file SHA256 mismatch"
            exit 1
          fi
          gunzip -c "$file" > mihomo
          chmod +x mihomo
          ./mihomo -v
          echo "MIHOMO_BIN=$RUNNER_TEMP/mihomo/mihomo" >> "$GITHUB_ENV"

      - name: Build Citrus
        run: |
          go build -trimpath -o "$RUNNER_TEMP/citrus" .
          echo "CITRUS_BIN=$RUNNER_TEMP/citrus" >> "$GITHUB_ENV"

      - name: Interop tests
        working-directory: test/interop
        env:
          INTEROP_LOG_DIR: ${{ runner.temp }}/interop-logs
        run: go test -tags interop -v -count=1 -timeout 10m -run TestMihomoClient ./...

      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-mihomo-logs-${{ matrix.mihomo }}
          path: ${{ runner.temp }}/interop-logs
          if-no-files-found: ignore
          retention-days: 14
