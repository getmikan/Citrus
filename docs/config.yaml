  # openvpn
  - name: "openvpn"
    type: openvpn
    server: vpn.example.com
    port: 1194
    proto: udp # udp/tcp，默认 udp
    # dev: tun # 目前仅支持 tun，默认 tun
    # cipher: AES-128-GCM # 支持 AES-128-GCM / AES-192-GCM / AES-256-GCM / AES-128-CBC / AES-192-CBC / AES-256-CBC / CHACHA20-POLY1305，默认 AES-128-GCM；AES-CBC 会按 AES-128-CBC 处理
    # data-ciphers: [AES-256-GCM, AES-128-GCM] # 数据通道 cipher 协商列表，发送 IV_CIPHERS 给服务端；服务端 push 的 cipher 列表与本地列表取交集，取第一个匹配项
    # data-ciphers-fallback: AES-128-CBC # 协商失败时的回退 cipher（对应 --data-ciphers-fallback）
    # auth: SHA256 # 支持 MD5 / SHA1 / SHA256 / SHA384 / SHA512，默认 SHA256；AEAD cipher 会忽略 auth
    # comp-lzo: "no" # 可选值："yes", "no", "adaptive"
    # username / password: auth-user-pass 模式（与下方 cert+key 二选一，不能都不填）
    # username: "user"
    # password: "pass"
    # 从 .ovpn 中复制 <ca></ca> 内的内容，不需要保留 <ca> 标签
    ca: |
      -----BEGIN CERTIFICATE-----
      MIIB...example
      -----END CERTIFICATE-----
    # 从 .ovpn 中复制 <cert></cert> 内的内容（auth-user-pass 时可省略 cert / key）
    cert: |
      -----BEGIN CERTIFICATE-----
      MIIB...example
      -----END CERTIFICATE-----
    # 从 .ovpn 中复制 <key></key> 内的内容
    key: |
      -----BEGIN PRIVATE KEY-----
      MIIE...example
      -----END PRIVATE KEY-----
    # 从 .ovpn 中复制 <tls-auth></tls-auth> 内的内容，不需要保留 <tls-auth> 标签；与 tls-crypt 互斥
    # tls-auth: |
    #   -----BEGIN OpenVPN Static key V1-----
    #   00000000000000000000000000000000
    #   ...
    #   -----END OpenVPN Static key V1-----
    # key-direction: "1" # tls-auth 使用，支持 "1" 或 "0"；如果不填或为空字符串，则为双向模式（bidirectional）
    # 从 .ovpn 中复制 <tls-crypt></tls-crypt> 内的内容，不需要保留 <tls-crypt> 标签；没有 tls-crypt 的配置可省略；与 tls-auth / tls-crypt-v2 互斥
    # tls-crypt: |
    #   -----BEGIN OpenVPN Static key V1-----
    #   00000000000000000000000000000000
    #   ...
    #   -----END OpenVPN Static key V1-----
    # 从 .ovpn 中复制 <tls-crypt-v2></tls-crypt-v2> 内的内容；tls-crypt-v2 使用独立客户端密钥（PEM 内含 256 字节密钥 + wrapped key）；与 tls-auth / tls-crypt 互斥
    # tls-crypt-v2: |
    #   -----BEGIN OpenVPN tls-crypt-v2 client key-----
    #   AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8...
    #   -----END OpenVPN tls-crypt-v2 client key-----
    # peer-info: # 透传给服务端的 peer-info 键值对，追加在内置 IV_VER/IV_PROTO/IV_CIPHERS 之后；用于服务端基于 peer-info 做准入决策
    #   IV_HWADDR: "52:54:00:ff:72:87"
    #   UV_DEVICE_ID: "laptop-001"
    # ping: 10 # 默认值为 0
    # ping-restart: 60 # 默认值为 0
    # tran-window: 3600 # 旧 data key 在 rekey 后保留的秒数；默认 3600，显式设为 0 表示立即过期，应与服务端 --tran-window 对齐
    # handshake-timeout: 30 # 单位为秒；配置后握手时不受外层连接超时影响；默认值为 0，表示仅使用外层连接超时
    # tls-version-min: "1.3" # lowest TLS version of the control channel, "1.2" or "1.3"; unset = 1.2 (as --tls-version-min)
    # Server identity. Without these only the CA chain and the server EKU are checked (any server
    # certificate from the same CA is accepted) and a warning is logged.
    # verify-x509-name: server_abc123 # as --verify-x509-name in the .ovpn file
    # verify-x509-type: name # subject (default, e.g. "C=US, O=VPN, CN=server"), name (common name) or name-prefix
    # verify-server-name: true # require the certificate to be valid for `server` (DNS name or IP SAN)
    # mtu: 1500
    udp: true
    # ip-stack:
    #   mode: auto # options: auto, mips, gvisor; auto uses citrus IP stack (MIPS), gvisor needs compiled with -tags with_gvisor
    #   congestion-controller: cubic # TCP congestion controller: cubic, reno, bbr, or bbr3; ignored by gVisor
    # 一个出站代理的标识。当值不为空时，将使用指定的 proxy 发出连接
    # dialer-proxy: "ss1"
    # remote-dns-resolve: true # 强制 dns 远程解析，默认值为 false
    # dns: [ 1.1.1.1, 8.8.8.8 ] # 仅在 remote-dns-resolve 为 true 时生效

