  # All storage options from xdrive-opts are also accepted in xdrive-config.

  - name: vless-in-1
    type: vless
    port: 10817 # 支持使用ports格式，例如200,302 or 200,204,401-429,501-503
    listen: 0.0.0.0
    # routing-mark: 0 # 为监听socket设置routing-mark（仅支持linux）
    # rule: sub-rule-name1 # 默认使用 rules，如果未找到 sub-rule 则直接使用 rules
    # proxy: proxy # 如果不为空则直接将该入站流量交由指定 proxy 处理 (当 proxy 不为空时，这里的 proxy 名称必须合法，否则会出错)
    users:
      - username: 1
        uuid: 9d0cb9d0-964f-4ef6-897d-6c6b3ccf9e68
        flow: xtls-rprx-vision
    # ws-path: "/" # 如果不为空则开启 websocket 传输层
    # grpc-service-name: "GunService" # 如果不为空则开启 grpc 传输层
    # fallback-page: ./page.html # 有 websocket/grpc/xhttp 传输层时，不属于该入站的请求在 "/" 得到此 HTML 页面，其他路径为 404
    #   A request that is not the inbound's own gets this HTML page at "/" (404 elsewhere)
    #   instead of a bare 404; only with an HTTP transport (ws/grpc/xhttp)
    # xhttp-config: # 如果不为空则开启 xhttp 传输层
    #   path: "/"
    #   host: ""
    #   mode: auto # Available: "stream-one", "stream-up" or "packet-up"
    #   no-sse-header: false
    #   x-padding-bytes: "100-1000"
    #   x-padding-obfs-mode: false
    #   x-padding-key: x_padding
    #   x-padding-header: X-Padding
    #   x-padding-placement: queryInHeader # Available: queryInHeader, cookie, header, query
    #   x-padding-method: repeat-x # Available: repeat-x, tokenish
    #   # uplink-http-method 服务端不限制：packet-up 上传可用任意方法（含 GET），与 Xray-core 一致
    #   session-placement: path # Available: path, query, cookie, header
    #   session-key: ""
    #   session-table: "" # Available: "", "uuid", "ALPHABET", "Alphabet", "BASE36", "Base62", "HEX", "alphabet", "base36", "hex", "number"
    #   session-length: "16-32" # 起始值不可为 0，总的 id 空间必须大于 21 亿，仅当session-table不为空或uuid时生效
    #   seq-placement: path # Available: path, query, cookie, header
    #   seq-key: ""
    #   uplink-data-placement: auto # Available: auto, body, cookie, header; auto 同时读取 header、cookie 和 body
    #   uplink-data-key: "" # 默认 header 为 X-Data，cookie 为 x_data
    #   uplink-chunk-size: 0 # only applicable when uplink-data-placement is not body
    #   sc-max-buffered-posts: 30
    #   sc-stream-up-server-secs: "20-80"
    #   sc-max-each-post-bytes: 1000000
    #   server-max-header-bytes: 0 # 请求头大小上限（h1 与 h2），0 为 1 MiB；Xray-core 默认 8192。数据放在 header/cookie 时需足够大
    # -------------------------
    # vless encryption服务端配置：
    # （原生外观 / 只 XOR 公钥 / 全随机数。1-RTT 每次下发随机 300 到 600 秒的 ticket 以便 0-RTT 复用 / 只允许 1-RTT）
    # 填写 "600s" 会每次随机取 50% 到 100%，即相当于填写 "300-600s"
    # / 是只能选一个，后面 base64 至少一个，无限串联，使用 citrus generate vless-x25519 和 citrus generate vless-mlkem768 生成，替换值时需去掉括号
    #
    # Padding 是可选的参数，仅作用于 1-RTT 以消除握手的长度特征，双端默认值均为 "100-111-1111.75-0-111.50-0-3333"：
    # 在 1-RTT client/server hello 后以 100% 的概率粘上随机 111 到 1111 字节的 padding
    # 以 75% 的概率等待随机 0 到 111 毫秒（"probability-from-to"）
    # 再次以 50% 的概率发送随机 0 到 3333 字节的 padding（若为 0 则不 Write()）
    # 服务端、客户端可以设置不同的 padding 参数，按 len、gap 的顺序无限串联，第一个 padding 需概率 100%、至少 35 字节
    # -------------------------
    # decryption: "mlkem768x25519plus.native/xorpub/random.600s(300-600s)/0s.(padding len).(padding gap).(X25519 PrivateKey).(ML-KEM-768 Seed)..."
    # 下面两项如果填写则开启 tls（需要同时填写）
    # certificate: ./server.crt # 证书 PEM 格式，或者 证书的路径
    # private-key: ./server.key # 证书对应的私钥 PEM 格式，或者私钥路径
    # 下面两项为mTLS配置项，如果client-auth-type设置为 "verify-if-given" 或 "require-and-verify" 则client-auth-cert必须不为空
    # client-auth-type: "" # 可选值：""、"request"、"require-any"、"verify-if-given"、"require-and-verify"
    # client-auth-cert: string # 证书 PEM 格式，或者 证书的路径
    # 如果填写则开启ech（可由 citrus generate ech-keypair <明文域名> 生成）
    # ech-key: |
    #   -----BEGIN ECH KEYS-----
    #   ACATwY30o/RKgD6hgeQxwrSiApLaCgU+HKh7B6SUrAHaDwBD/g0APwAAIAAgHjzK
    #   madSJjYQIf9o1N5GXjkW4DEEeb17qMxHdwMdNnwADAABAAEAAQACAAEAAwAIdGVz
    #   dC5jb20AAA==
    #   -----END ECH KEYS-----
    # jls-config: # JLS 替代普通 TLS；未认证连接回落到 dest
    #   enable: true
    #   users:
    #     - username: jls-user
    #       password: jls-password
    #   dest: www.example.com:443
    #   # sni: www.example.com # 留空时从 dest 推导
    #   # alpn: [h2, http/1.1]
    #   # proxy: ""
    #   # rate-limit: 0 # fallback 转发限速，单位 bit/s；0 表示不限速
    # 如果填写reality-config则开启reality（注意不可与certificate和private-key同时填写）
    reality-config:
      dest: test.com:443
      private-key: jNXHt1yRo0vDuchQlIP6Z0ZvjT3KtzVI-T4E7RoLJS0 # 可由 citrus generate reality-keypair 命令生成
      short-id:
        - 0123456789abcdef
      server-names:
        - test.com
      # max-time-difference: 60000 # 选填, 允许的客户端时间误差 (毫秒, 同 Xray 的 maxTimeDiff), 默认 0 不检查
      # 以下为选填, 与 Xray 服务端 (v26.9.8+) 的 REALITY 选项一致, 也适用于其他入站的 reality-config
      # mldsa65-seed: xxx # Xray 的 mldsa65Seed (可由 xray mldsa65 生成), 对临时证书做 ML-DSA-65 签名; 客户端的 mldsa65-verify (分享链接 pqv) 填对应公钥
      #                   # 注意: dest 的证书链需足够长 (约 3.5 KB 以上) 以容纳签名, 否则握手失败
      # require-x25519mlkem768: true # 仅接受带 X25519MLKEM768 key share 的客户端 (同 Xray v26.9.8+ 服务端); 旧客户端 / support-x25519mlkem768: false 将被回落到 dest
      # min-client-ver: 26.9.8 # 客户端上报的 Xray 版本下限 (Citrus 客户端默认上报 26.10.10, 见 reality-opts.client-version)
      # max-client-ver: 26.10.10 # 版本上限
      #下列两个 limit 为选填，可对未通过验证的回落连接限速，bytesPerSec 默认为 0 即不启用
      #回落限速是一种特征，不建议启用，如果您是面板/一键脚本开发者，务必让这些参数随机化
      limit-fallback-upload:
        after-bytes: 0 # 传输指定字节后开始限速
        bytes-per-sec: 0 # 基准速率（字节/秒）
        burst-bytes-per-sec: 0 # 突发速率（字节/秒），大于 bytesPerSec 时生效
      limit-fallback-download:
        after-bytes: 0 # 传输指定字节后开始限速
        bytes-per-sec: 0 # 基准速率（字节/秒）
        burst-bytes-per-sec: 0 # 突发速率（字节/秒），大于 bytesPerSec 时生效
    # shadow-tls:
    #   enable: true
    #   version: 3 # 支持 v1/v2/v3
    #   # password: shadow-tls-password # v2 配置项
    #   users: # v3 配置项
    #     - name: shadow-tls-user
    #       password: shadow-tls-password
    #   handshake:
    #     dest: www.example.com:443
    #   # wildcard-sni: off # v3设置项，可选 off / authed / all：authed 时已认证用户按 SNI 握手 (SNI:443)；all 时未认证的连接也按 SNI 回落，
    #   #                   # 但仅限公网域名 (拒绝 IP、localhost、单标签名等)，且解析结果须全为公网地址 (非回环/内网/链路本地/CGNAT/云元数据)，否则回落到 handshake.dest
    #     # proxy: ""
    # res-tls:
    #   enable: true
    #   dest: www.example.com:443
    #   password: restls-password
    #   # restls-script: ""
    #   # min-record-len: 0
    #   # proxy: ""
    #   # rate-limit: 0 # fallback 双向转发限速，单位 bit/s；0 表示不限速
    ### 注意，对于vless listener, 如果 "allow-insecure" 不为 true, 至少需要填写 “certificate和private-key” 或 “shadow-tls” 或 “res-tls” 或 “jls-config” 或 “reality-config” 或 “decryption” 的其中一项 ###
    # allow-insecure: false # 是否允许不开启tls加密（注意：仅用于有 nginx, caddy 前置的情况）
    # # Real client IP behind a reverse proxy or CDN (ws, grpc and xhttp only): the source address of
    # # the connection (logs, SRC-IP rules, IP filters, auth events) is taken from this header.
    # trusted-proxy-header: "" # header to read real client IP from (e.g. X-Forwarded-For, X-Real-IP, CF-Connecting-IP)
    # # The header is believed only when the TCP peer is in this list; empty (the default) = never.
    # # CIDRs, single addresses, "loopback" (127.0.0.0/8, ::1) and "private" (10/8, 172.16/12, 192.168/16, fc00::/7).
    # # X-Forwarded-For is read from the right, skipping trusted proxies (like nginx real_ip_recursive),
    # # so an address the client puts at its left is ignored. For a CDN, list the CDN's ranges.
    # trusted-proxies: [loopback]

  - name: anytls-in-1
