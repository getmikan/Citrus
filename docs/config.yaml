    # udp-over-stream: false # UDP over stream, default false
    # zero-rtt: false # 官方 server 的 0-RTT 路径可能在 JLS 认证完成前读取用户状态（已确认影响 v0.3.11）；使用官方 server 如果遇到不通或断联情况，请在服务端关闭 zero-rtt
    # keep-alive-interval: 10000
    # congestion-controller: bbr # Available: "cubic", "new_reno", "bbr". Default: "cubic"
    # up: 100 Mbps # enables brutal negotiation via a citrus private extension; client upload speed; falls back to congestion-controller when unsupported
    # down: 100 Mbps # enables brutal negotiation via a citrus private extension; requested client download speed, capped by listener up; falls back to congestion-controller when unsupported
    # cwnd: 10 # default: 32
    # bbr-profile: "" # Available: "standard", "conservative", "aggressive". Default: "standard"
    # max-datagram-frame-size: 1400
    # max-open-streams: 1024
    # recv-window-conn: 0
    # recv-window: 0
    # disable-mtu-discovery: false

  - name: "ssh-out"
    type: ssh

    server: 127.0.0.1
    port: 22
    username: root
    password: password
    private-key: path
    # Server key(s) in authorized_keys format (e.g. from `ssh-keyscan -t ed25519 host`).
    # Without host-key the server is not authenticated and a warning is logged.
    # host-key:
    #   - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA..."
    # skip-host-key-check: true # accept any server key without the warning (not recommended)

  # mieru
  - name: mieru
    type: mieru
    server: 1.2.3.4
    port: 2999
    # port-range: 2090-2099 #（不可同时填写 port 和 port-range）
    transport: TCP # 支持 TCP 或者 UDP
    udp: true # 支持 UDP over TCP
    username: user
    password: password
    # 可以使用的值包括 MULTIPLEXING_OFF, MULTIPLEXING_LOW, MULTIPLEXING_MIDDLE, MULTIPLEXING_HIGH。其中 MULTIPLEXING_OFF 会关闭多路复用功能。默认值为 MULTIPLEXING_LOW。
    # multiplexing: MULTIPLEXING_LOW
    # 如果想开启 0-RTT 握手，请设置为 HANDSHAKE_NO_WAIT，否则请设置为 HANDSHAKE_STANDARD。默认值为 HANDSHAKE_STANDARD
    # handshake-mode: HANDSHAKE_STANDARD
    # 一个 base64 字符串用于微调网络行为
    # traffic-pattern: ""

  # sudoku
  - name: sudoku
    type: sudoku
    server: server_ip/domain # 1.2.3.4 or domain
    port: 443 
    key: "<client_key>" # 如果你使用sudoku生成的ED25519密钥对，请填写密钥对中的私钥，否则填入和服务端相同的uuid
    aead-method: chacha20-poly1305 # 可选：chacha20-poly1305、aes-128-gcm、none（不建议；none 不提供 AEAD 保护）
    padding-min: 2 # 最小填充率（0-100）
    padding-max: 7 # 最大填充率（0-100，必须 >= padding-min）
    table-type: prefer_ascii    # 可选值：prefer_ascii、prefer_entropy、up_ascii_down_entropy、up_entropy_down_ascii
    # custom-table: xpxvvpvv    # 可选，自定义字节布局，必须包含2个x、2个p、4个v，可随意组合；只对 entropy 方向生效
    # custom-tables: ["xpxvvpvv", "vxpvxvvp"] # 可选，自定义字节布局列表（x/v/p），非空时覆盖 custom-table
    # multiplex: "off" # 可选：off（默认）、auto（仅复用 HTTPMask 底层连接）、on（在原始 TCP 或 HTTPMask 上启用 Sudoku 单会话多目标 mux）
    # 推荐：使用 httpmask 对象统一管理 HTTPMask 相关字段：
    httpmask:
      disable: false # true 禁用所有 HTTP 伪装/隧道
      mode: legacy # 可选：legacy（默认）、stream（split-stream）、poll、auto（先 stream 再 poll）、ws（WebSocket 隧道）
      # tls: true # 可选：按需开启 HTTPS/WSS
      # host: "" # 可选：覆盖 Host/SNI（支持 example.com 或 example.com:443）；仅在 mode 为 stream/poll/auto/ws 时生效
      # path-root: "" # 可选：HTTP 隧道端点一级路径前缀（双方需一致），例如 "aabbcc" 或 "/aabbcc/" => /aabbcc/session、/aabbcc/stream、/aabbcc/api/v1/upload、/aabbcc/ws
      # multiplex: "off" # 兼容旧配置；设置时优先于顶层 multiplex
    enable-pure-downlink: false # 可选：false=带宽优化下行；true=纯 Sudoku 下行

  # anytls
  - name: anytls
    type: anytls
    server: 1.2.3.4
    port: 443
    password: "<your password>"
    # client-fingerprint: chrome
    udp: true
    # client-metadata: "" # 发送给服务端的客户端元数据，由于这可能被用于统计客户端信息并区别对待，从v1.19.30开始默认再不发送该内容，如果需要请自行填写
    # idle-session-check-interval: 30 # seconds
    # idle-session-timeout: 30 # seconds
    # min-idle-session: 0
    # sni: "example.com"
    # alpn:
    #   - h2
    #   - http/1.1
    # skip-cert-verify: true
    # name-cert-verify: example.com # 仅修改证书 DNSName 校验目标，不修改 SNI
    # shadow-tls-opts: # 使用 sni 作为 ShadowTLS SNI
    #   version: 3 # 支持 v1/v2/v3；留空时默认为 v2
    #   password: shadow-tls-password
    # restls-opts: # 使用 sni 作为 Restls SNI
    #   password: restls-password
    #   version-hint: tls13 # 可选值：tls12、tls13
    #   # restls-script: ""
    # jls-opts: # 使用 sni 作为 JLS SNI
    #   username: jls-user
    #   password: jls-password

  # trusttunnel
  - name: trusttunnel
    type: trusttunnel
    server: 1.2.3.4
    port: 443
    username: username
    password: password
    # client-fingerprint: chrome
    health-check: true
    udp: true
    # sni: "example.com"
    # alpn:
    #   - h2
    # skip-cert-verify: true
    # name-cert-verify: example.com # 仅修改证书 DNSName 校验目标，不修改 SNI
    ### quic options
    # quic: true # 默认为false
    # congestion-controller: bbr
    # bbr-profile: "" # Available: "standard", "conservative", "aggressive". Default: "standard"
    ### reuse options
    # max-connections: 8 # Maximum connections. Conflict with max-streams.
    # min-streams: 5 # Minimum multiplexed streams in a connection before opening a new connection. Conflict with max-streams.
    # max-streams: 0 # Maximum multiplexed streams in a connection before opening a new connection. Conflict with max-connections and min-streams.
    ### HTTP/2 session timers (seconds; 0 = default). Not applied with quic: true.
    # ping-interval: 15 # Ping a session that received nothing for this long. -1 turns pings off.
    # ping-timeout: 15 # Close the session if the ping is not answered in time; its streams fail and are redialed.
    # handshake-timeout: 0 # Bounds TCP dial + TLS handshake of a new session. 0 = default TLS timeout.

# dns 出站会将请求劫持到内部 dns 模块，所有请求均在内部处理
  - name: "dns-out"
    type: dns

  - name: "rematch"
    type: rematch
    target-rematch-name: "rematch1" # 如果填写则覆盖原始 metadata 中的 rematch-name（可用REMATCH-NAME规则匹配）
    target-sub-rule: "sub-rule1" # 如果填写则接下来会直接用指定的 sub-rule 匹配，如果名字不存在或为空会回退到主rules

  # 配置指定 interface-name 和 fwmark 的 DIRECT
  - name: en1-direct
    type: direct
    interface-name: en1
    routing-mark: 6667
proxy-groups:
  # url-test 将按照 url 测试结果使用延迟最低节点
  - name: "auto"
    type: url-test
    proxies:
      - ss1
      - ss2
      - vless1
    # tolerance: 150
    # lazy: true
    # expected-status: 204 # 当健康检查返回状态码与期望值不符时，认为节点不可用
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300

  # fallback 将按照 url 测试结果按照节点顺序选择
  - name: "fallback-auto"
    type: fallback
    proxies:
      - ss1
      - ss2
      - vless1
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300

  # load-balance 将按照算法随机选择节点
  - name: "load-balance"
    type: load-balance
    proxies:
      - ss1
      - ss2
      - vless1
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
  # strategy: consistent-hashing # 可选 round-robin 和 sticky-sessions
  # hash-key: in-user # 可选,仅 consistent-hashing 和 sticky-sessions 支持;
  #                   # round-robin 不做哈希,配置它会报错而不是被忽略。
  #                   # 只改变「拿什么值去哈希」,不改变策略拿到哈希值之后如何选节点;
  #                   # 不填时行为与旧版完全一致。
  #                   # in-user 用 inbound 的认证用户名作 key(与 IN-USER 规则读取的是
  #                   # 同一个字段),它不随目标地址变化,因此一件跨多个域名的任务不会
  #                   # 中途换节点、换出口 IP。未认证的请求回退到该策略原本的 key。
  #                   # 两种策略给出的一致性时长不同(前者永久、后者 10 分钟),
  #                   # 取舍见 PR #3133。

  # chain: a cascade of hops (entry -> ... -> exit). Every hop after the first
  # one is dialed through the hop before it: the config sets the dialer-proxy
  # of the proxies that make the hop up (a proxy; the members of a group and
  # the providers of its `use`; the first hop of a nested chain). Those proxies
  # then always go through the previous hop, also when they are used on their
  # own, so the health checks of an exit group go through the entry as well and
  # a url-test/fallback as the last hop fails over across the exits.
  # The first hop can be anything: a proxy, a group, DIRECT.
  # Load errors: a hop not found, a hop listed twice, a loop (e.g. a group of
  # the chain that contains the chain), a dialer-proxy already set to another
  # proxy, a built-in or a group with include-all after the first hop.
  # The health check tests the whole chain; when it fails, it tests the hops
  # from the first one (hop k goes through hops 1..k-1) and reports the first
  # hop that fails: /proxies/cascade (hops, chainAlive, failedHop,
  # failedHopPosition, chainError), /metrics (citrus_chain_alive,
  # citrus_chain_hop_alive) and the chain.health event of GET /events.
  # - name: exits
  #   type: url-test
  #   proxies:
  #     - vless-de
  #     - vless-nl
  #   url: "https://cp.cloudflare.com/generate_204"
  # - name: cascade
  #   type: chain
  #   proxies:          # in order: the first hop, ..., the exit
  #     - ss1           # entry
  #     - exits         # exit: a group, failover across exits
  #   url: "https://cp.cloudflare.com/generate_204"
  #   interval: 300
  #   # timeout: 5000
  #   # lazy: true
  #   # expected-status: 204
  #   # disable-udp: true
  #   # `use`, `include-all*` and `filter` are not supported on a chain

  # select 用户自行选择节点
  - name: Proxy
    type: select
    # disable-udp: true
    proxies:
      - ss1
      - ss2
      - vless1
      - auto
    # default-selected: ss1 # 默认选择的节点（该项为空或者设置的节点名不存在时，默认选择组中第一个节点）

  - name: UseProvider
    type: select
    filter: "HK|TW" # 正则表达式，过滤 provider1 中节点名包含 HK 或 TW
    use:
      - provider1
    proxies:
      - Proxy
      - DIRECT
    # empty-fallback: COMPATIBLE # 设置当组为空时的回退proxy（这里不支持填写代理组，只支持填写proxy名称）

# Citrus 格式的节点或支持 *ray 的分享格式
proxy-providers:
  provider1:
    type: http # http 的 path 可空置，默认储存路径为 homedir 的 proxies 文件夹，文件名为 url 的 md5
    url: "url"
    interval: 3600
    path: ./provider1.yaml # 默认只允许存储在 citrus 的 Home Dir，如果想存储到其他位置，请通过设置 SAFE_PATHS 环境变量指定额外的安全路径。该环境变量的语法同本操作系统的PATH环境变量解析规则（即Windows下以分号分割，其他系统下以冒号分割）
    proxy: DIRECT
    # size-limit: 10240 # 限制下载文件最大为10kb，超出则本次更新失败（不会截断）；默认为0即使用 64MiB 上限，-1 为不限制
    # #
    # # 如果设置会age-secret-key尝试通过此secret解密age armor格式加密的配置文件
    # #
    # # 注意：
    # #   对于加密内容，目前仅支持 age-encryption.org/v1 的 official ASCII "armor" format
    # #   对于key格式，目前仅支持 age-encryption.org/v1 的 x25519 recipient type 和 The mlkem768-x25519 hybrid post-quantum recipient type
    # # 实用工具：
    # #   您可以通过 "citrus age keygen" 生成符合要求的 x25519 key
    # #   您可以通过 "citrus age keygen-pq" 生成符合要求的 mlkem768-x25519 key
    # #   您可以通过 "citrus age convert <secret_key>" 从 age-secret-key 导出 age-public-key
    # #   您可以通过 "citrus age decrypt <secret_key> <source_file> <target_file>" 将已加密文件解密，<source_file> 为 - 时会从标准输入读取，<target_file> 为 - 时会往标准输出写入
    # #   <secret_key> may be @/path/to/key.txt (read from a file) and, for convert, - (stdin): a key on the
    # #   command line is visible to other users of the host. The core takes -age-secret-key-file
    # #   (CLASH_AGE_SECRET_KEY_FILE) besides -age-secret-key (CLASH_AGE_SECRET_KEY).
    # #   您可以通过 "citrus age encrypt <public_key> <source_file> <target_file>" 将未加密文件加密，<source_file> 为 - 时会从标准输入读取，<target_file> 为 - 时会往标准输出写入
    # # 参考实现：
    # #   https://github.com/FiloSottile/awesome-age#implementations
    # #
    # age-secret-key: AGE-SECRET-KEY-1ZTQLLN0A4U3ZTT3DCZKYN0CGZEZQLWX2DFTXUWMT4ZHR0N2UG6LSW9NT0N
    header:
      User-Agent:
      - "Clash/v1.18.0"
      - "citrus/1.18.3"
      # Accept:
      # - 'application/vnd.github.v3.raw'
      # Authorization:
      # - 'token 1231231'
      # X-Age-Public-Key:
      # - 'age1xh86kh9v23vattr58yedspm3f57sxvnswu9krr6ns438amekx5gsd09uma'
    health-check:
      enable: true
      interval: 600
      # lazy: true
      url: https://cp.cloudflare.com/generate_204
      # expected-status: 204 # 当健康检查返回状态码与期望值不符时，认为节点不可用
    override: # 覆写节点加载时的一些配置项
      skip-cert-verify: true
      name-cert-verify: example.com # 仅修改证书 DNSName 校验目标，不修改 SNI
      udp: true
      # down: "50 Mbps"
      # up: "10 Mbps"
      # dialer-proxy: proxy
      # interface-name: tailscale0
      # routing-mark: 233
      # ip-version: ipv4-prefer
      # additional-prefix: "[provider1]"
      # additional-suffix: "test"
      # # 名字替换，支持正则表达式
      # proxy-name:
      #   - pattern: "test"
      #     target: "TEST"
      #   - pattern: "IPLC-(.*?)倍"
      #     target: "iplc x $1"
      # # 这是 yq v4 风格的配置覆盖子集。数组项按顺序执行，且晚于上面的固定字段覆盖。
      # # 路径：.、.name、."a.b"、.["a.b"]、.items[0]、.items[-1]。[] 可以遍历数组或 mapping。
      # # 读取缺失路径或穿过标量时返回 null。赋值会创建缺失的 mapping 和非负数组索引，但不会穿过标量更新。
      # # 赋值：=、|=、+=、-=、*=。删除：del(.field)、del(.a, .b)。
      # # 值：null（或 ~）、布尔值、十进制/十六进制整数、浮点数、双引号字符串、数组及双引号键的 mapping。
      # # 负号只用于十进制整数和浮点数。浮点数支持科学计数法。
      # # 字符串按 yq 规则解码 \n、\"、\\；其他反斜杠序列保留原文。
      # # 数组会收集每一项的全部结果。mapping 的 value 为零结果时省略 key，多结果时保留最后一个。
      # # 运算：+、-、*、/、%、==、!=、<、<=、>、>=、and、or、//（默认值）。
      # # + 可拼接字符串/数组或浅合并 mapping；* 可做数乘、字符串重复、数组替换或深合并 mapping；/ 可分割字符串。
      # # 流：管道 |、逗号 union、select。使用 [...] 将零到多个结果收集为数组。
      # # 字符串支持 "[\(.type)] \(.name)" 形式的插值。插值表达式有多个结果时使用第一个。
      # # 字符串外的 # 会忽略该数组项中的后续表达式内容。
      # # 查询函数：length、keys、has(key/index)、contains(value)、select(condition)。字符串 length 按 UTF-8 字节数计算。
      # # 数组函数：reverse、sort、unique、flatten([depth])、any、all。
      # # 转换函数：map、map_values、filter、to_entries、from_entries、with_entries、any_c、all_c。
      # # map/filter/map_values 支持数组或 mapping。with_entries 只支持 mapping，any_c/all_c 只支持数组。
      # # map/filter 返回数组，map_values 保持输入集合类型。to_entries(null) 不产生结果。
      # # from_entries 只接受具有字符串 key 的 entries 数组。
      # # 字符串函数：test(pattern[, "g"])、sub(pattern, replacement)、split(separator)、join(separator)、upcase、downcase、trim。
      # # split(null) 不产生结果，join 只接受数组。
      # # 类型函数：tostring、tonumber、type、not。tonumber 支持十进制、0x 十六进制、0o 八进制和浮点字符串。
      # override-expr:
      #   - '.name = "[provider1] " + .name'                   # 普通赋值
      #   - '.plugin-opts.mode = "tls"'                        # 自动创建缺失的 mapping
      #   - '.alpn[] |= upcase'                                # 更新数组中的每一项
      #   - 'del(.skip-cert-verify)'                           # 删除字段
      #   - '.name = (.name | trim | upcase)'                  # 赋值右侧的管道需加括号
      #   - '.name = "[\(.type)] \(.name):\(.port)"'           # 字符串插值
      #   - '(select(.port == 443) | .tls) = true'             # 条件不匹配时不修改
      #   - '.tags |= (unique | sort)'                         # 去重后排序
      #   - '.names = [.servers[] | select(.enabled) | .name]' # 收集多个结果
      #   - '.servers |= map(select(.enabled))'                # 筛选数组
      #   - '.options |= with_entries(.key |= upcase)'         # 转换 mapping
      #   - '. | with_entries(.key |= upcase)'                 # 整体过滤结果仍须为 mapping
      # # 每一项最终必须恰好产生一个 mapping。未收集的多结果及 del(.) 不受支持。
      # # 赋值右侧使用管道或 and/or 时必须加括号。from_entries 只接受字符串 key。
      # # sort 只支持标量数组。any/all 只支持无参数形式。
      # # ==/!= 按 yq 的标量文本值比较，不对数组或 mapping 做结构化比较。
      # # <、<=、>、>= 只支持数字、字符串和 null。只有 false 和 null 按假值处理。
      # # 普通函数参数不得产生多个结果；map/filter 等接收表达式的函数允许参数产生结果流。
      # # 函数参数可使用逗号或分号分隔。
      # # 求值采用值语义。越界读取不会扩展源数组，右侧的 flatten/map_values 也不会隐式修改源路径。
      # # 需要修改源路径时请使用 |=。右侧没有结果时保留目标原值，不会自动创建 null。
      # # mapping 流、keys 和 entries 转换按 key 排序，因为 map[string]any 不保留 YAML key 顺序。
      # # 不支持的语言功能：变量（as/$x）、reduce、动态路径（.[$key]）、递归下降（..）。
      # # 不支持的外部功能：多文档、文件/环境访问、YAML tag/样式/注释处理、yq CLI 参数。
      # # 未在上面列出的 yq 语法、运算符和函数也不受支持。条件分支可改用 select 后串联多个赋值。

  provider2:
    type: inline
    dialer-proxy: proxy
    payload:
      - name: "ss1"
        type: ss
        server: server
        port: 443
        cipher: chacha20-ietf-poly1305
        password: "password"

  test:
    type: file
    path: /test.yaml
    health-check:
      enable: true
      interval: 36000
      url: https://cp.cloudflare.com/generate_204
rule-providers:
  rule1:
    behavior: classical # domain ipcidr
    interval: 259200
    path: /path/to/save/file.yaml # 默认只允许存储在 citrus 的 Home Dir，如果想存储到其他位置，请通过设置 SAFE_PATHS 环境变量指定额外的安全路径。该环境变量的语法同本操作系统的PATH环境变量解析规则（即Windows下以分号分割，其他系统下以冒号分割）
    type: http # http 的 path 可空置，默认储存路径为 homedir 的 rules 文件夹，文件名为 url 的 md5
    url: "url"
    proxy: DIRECT
    # size-limit: 10240 # 限制下载文件最大为10kb，超出则本次更新失败（不会截断）；默认为0即使用 64MiB 上限，-1 为不限制
  rule2:
    behavior: classical
    interval: 259200
    path: /path/to/save/file.yaml
    type: file
  rule3:
    # mrs类型ruleset，目前仅支持domain和ipcidr(即不支持classical），
    #
    # 对于behavior=domain:
    #  - format=yaml 可以通过“citrus convert-ruleset domain yaml XXX.yaml XXX.mrs”转换到mrs格式
    #  - format=text 可以通过“citrus convert-ruleset domain text XXX.text XXX.mrs”转换到mrs格式
    #  - XXX.mrs 可以通过"citrus convert-ruleset domain mrs XXX.mrs XXX.text"转换回text格式（暂不支持转换回yaml格式）
    #
    # 对于behavior=ipcidr:
    #  - format=yaml 可以通过“citrus convert-ruleset ipcidr yaml XXX.yaml XXX.mrs”转换到mrs格式
    #  - format=text 可以通过“citrus convert-ruleset ipcidr text XXX.text XXX.mrs”转换到mrs格式
    #  - XXX.mrs 可以通过"citrus convert-ruleset ipcidr mrs XXX.mrs XXX.text"转换回text格式（暂不支持转换回yaml格式）
    #
    type: http
    url: "url"
    format: mrs
    behavior: domain
    path: /path/to/save/file.mrs
    # path-in-bundle: "geo/geosite/cn.mrs" # 当设置该选项时，如果本地文件不存在，会优先从 Home Dir的 BundleMRS.7z 中解压该文件，此项的值用于指定在 BundleMRS.7z 中的路径
  rule4:
    type: inline
    behavior: domain # classical / ipcidr
    payload:
      - '.blogger.com'
      - '*.*.microsoft.com'
      - 'books.itunes.apple.com'

# 运行时可通过 PUT /rules 替换顶层规则：{"rules": ["DOMAIN,a.com,DIRECT", ...]}，
# 写法与此处相同，整体校验通过后才原子替换，否则返回 400 和错误。sub-rules 与 rule-providers 不变。
# 替换只在内存中：重新加载配置（PUT /configs、重启）会恢复此处的规则。
# Runtime API: PUT /rules {"rules": ["DOMAIN,a.com,DIRECT", ...]} replaces the
# top level rules. The lines are written and parsed as here (proxies, groups,
# RULE-SET, SUB-RULE, logic rules); the whole list is validated first and
# swapped at once, a bad line gives 400 with the error. Proxies of
# proxy-providers are not valid targets here either: use a group. sub-rules and
# rule-providers stay as they are. The change is in memory only: the next config
# reload (PUT /configs, a restart) brings back the rules of this file.
rules:
  - RULE-SET,rule1,REJECT
  - IP-ASN,1,PROXY
  - DOMAIN-REGEX,^abc,DIRECT
  - DOMAIN-SUFFIX,baidu.com,DIRECT
  - DOMAIN-KEYWORD,google,ss1
  - DOMAIN-WILDCARD,test.*.citrus.com,ss1
  - IP-CIDR,1.1.1.1/32,ss1
  - IP-CIDR6,2409::/64,DIRECT
  # 匹配嗅探到的应用层协议，需要开启对应的 sniffer（见 sniffer.sniff.BitTorrent）
  # Matches the application protocol a protocol sniffer reported; needs the
  # sniffer enabled (see sniffer.sniff.BitTorrent). Also works inside
  # AND/OR/NOT/SUB-RULE. Supported: bittorrent.
  # 对 UDP 而言，只有 REJECT / REJECT-DROP 能作用于已建立会话中的后续目标
  # For UDP only REJECT / REJECT-DROP can act on later destinations of an
  # established session. MSE/PE-encrypted BitTorrent over TCP is not detected.
  - PROTOCOL,bittorrent,REJECT
  # 当满足条件是 TCP 或 UDP 流量时，使用名为 sub-rule-name1 的规则集
  - SUB-RULE,(OR,((NETWORK,TCP),(NETWORK,UDP))),sub-rule-name1
  - SUB-RULE,(AND,((NETWORK,UDP))),sub-rule-name2
# 定义多个子规则集，规则将以分叉匹配，使用 SUB-RULE 使用
#                                               google.com(not match)--> baidu.com(match)
#                                                /                                ｜
#                                               /                                 ｜
#  https://baidu.com  --> rule1 --> rule2 --> sub-rule-name1(match tcp)          使用 DIRECT
#
#
#                                              google.com(not match)--> baidu.com(not match)
#                                                /                            ｜
#                                               /                             ｜
#  dns 1.1.1.1  --> rule1 --> rule2 --> sub-rule-name1(match udp)         sub-rule-name2(match udp)
#                                                                             ｜
#                                                                             ｜
#                                                                 使用 REJECT <-- 1.1.1.1/32(match)
#

sub-rules:
  sub-rule-name1:
    - DOMAIN,google.com,ss1
    - DOMAIN,baidu.com,DIRECT
  sub-rule-name2:
    - IP-CIDR,1.1.1.1/32,REJECT
    - IP-CIDR,8.8.8.8/32,ss1
    - DOMAIN,dns.alidns.com,REJECT

# 流量入站
# listeners 的用户可在运行时通过 API 增删改，无需重建监听器（vless、trojan、anytls、trusttunnel、
# tuic、多用户 shadowsocks、socks/http/mixed）：GET/PUT/POST /inbounds/{name}/users，
# PATCH/DELETE /inbounds/{name}/users/{user}。改动只在内存中，重新加载配置会恢复配置中的用户；
# 仅 users 不同的配置重载会原地更新用户而不重建监听器。
# The users of the listeners below can be changed at runtime through the API without
# recreating the listener (vless, trojan, anytls, trusttunnel, tuic, multi-user shadowsocks,
# socks/http/mixed): GET/PUT/POST /inbounds/{name}/users, PATCH/DELETE
# /inbounds/{name}/users/{user}. The changes live in memory; a config reload sets the users
# of the config again, and a reload that changes only the users updates them in place.
#
# 基于 TCP 的 listeners（http、socks、mixed、shadowsocks、snell、vless、trojan、anytls、sudoku、
# trusttunnel、tunnel、hysteria2-realm）可监听 UNIX socket：listen: unix:/path（不填 port），
# 用于放在 nginx/Caddy 后面。unix-mode 为 socket 权限（八进制，默认 0660；Windows 忽略）。
# 启动时会删除无人监听的残留 socket；正在使用的 socket 或非 socket 文件会报错且不会被删除；关闭时删除 socket。
# UDP（udp、kcp-tun、network: udp）以及 hysteria2、tuic、shadowquic、mieru、tun、redir、tproxy 不支持 UNIX socket。
# UNIX socket 的对端视为 127.0.0.1（端口 0）：lan-allowed-ips、skip-auth-prefixes、trusted-proxies 等按回环地址处理；
# 若要使用反向代理传来的真实 IP，需设置 trusted-proxy-header 并设置 trusted-proxies: [loopback]。
# TCP-based listeners (http, socks, mixed, shadowsocks, snell, vless, trojan, anytls, sudoku,
# trusttunnel, tunnel, hysteria2-realm) can listen on a unix socket instead of TCP ports, to sit
# behind nginx or Caddy: listen: unix:/path, with no port. A relative path is taken from the home
# directory. unix-mode sets the permissions of the socket (octal, default 0660: the user the core
# runs as and its group; put the proxy's user in that group or use 0666), applied before anybody
# can connect; Windows ignores it. On start a stale socket nobody listens on is removed; a socket
# in use or a file that is not a socket is an error and is never removed. Close removes the socket.
# UDP (udp, kcp-tun, network: udp) and the UDP/QUIC or host-bound listeners (hysteria2, tuic,
# shadowquic, mieru, tun, redir, tproxy) cannot use a unix socket; udp defaults to false there.
# A unix peer has no IP and is reported as 127.0.0.1 (port 0), like a proxy on a loopback port:
# lan-allowed-ips, skip-auth-prefixes (127.0.0.1/8 there skips auth for every unix client),
# per-user IP limits and SRC-IP rules see 127.0.0.1. To get the client address the proxy
# forwards, set trusted-proxy-header and trusted-proxies: [loopback] (vless, trojan, hysteria2-realm).
#   nginx: proxy_pass http://unix:/run/citrus/vless.sock;  (or grpc_pass unix:/run/citrus/vless.sock;)
#   Caddy: reverse_proxy unix//run/citrus/vless.sock
# PROXY protocol（仅 TCP）：基于 TCP 的 listeners（同上，含 UNIX socket）可设置 proxy-protocol: true，
# 此时每个 TCP 连接都必须以 PROXY protocol v1 或 v2 头开头（前置 SNI 路由、HAProxy、nginx stream 等
# 带 proxy_protocol 转发时发送），连接的来源地址（日志、SRC-IP 规则、IP 过滤、用户 IP 数/设备数限制、
# 认证事件）取自该头；本地地址保持不变。没有头、头格式错误或 5 秒内没有头的连接会被直接关闭。
# 只有 proxy-protocol-trusted 中的对端可以发送该头（CIDR、单个地址、"loopback"、"private"；默认仅回环
# 127.0.0.0/8 与 ::1），其他对端的连接被直接关闭，因为头里的地址可以是任意值。
# LOCAL 命令（v2）和 UNKNOWN（v1）保持真实对端地址。UDP 不受影响（UDP 没有该头），socks/shadowsocks 的 UDP 部分保持不变；
# hysteria2、tuic、shadowquic、mieru、tun、redir、tproxy 没有 TCP 流，设置该选项会报错。REALITY 的 dest 回落照常工作。
# PROXY protocol (TCP only): the TCP stream listeners (the ones above, unix sockets included) accept
# proxy-protocol: true. Every TCP connection must then start with a PROXY protocol v1 or v2 header, as an
# SNI router, HAProxy or nginx stream with proxy_protocol sends in front of a forwarded connection, and the
# source address of the connection (logs, SRC-IP rules, IP filters, per-user IP and device limits, auth
# events) is the client address of the header; the local address is unchanged. A connection without a
# header, with a malformed one or with none within 5 seconds is closed. Only the peers in
# proxy-protocol-trusted may send the header (CIDRs, single addresses, "loopback", "private"; loopback
# 127.0.0.0/8 and ::1 only when empty): a connection from any other peer is closed, since the address in
# a header from the internet could be anything. The v2 LOCAL command and the v1 UNKNOWN line keep the
# address of the peer. UDP has no such header and is not touched (the UDP side of socks/shadowsocks stays
# as it is); the listeners without TCP streams (hysteria2, tuic, shadowquic, mieru, tun, redir, tproxy)
# refuse the option.
# REALITY keeps falling back to its dest for other clients: the header is consumed before the handshake.
listeners:
