    #   # proxy: ""
    #   # rate-limit: 0 # fallback 转发限速，单位 bit/s；0 表示不限速
    # 如果填写reality-config则开启reality（注意不可与certificate和private-key同时填写）
    # reality-config:
    #   dest: test.com:443
    #   private-key: jNXHt1yRo0vDuchQlIP6Z0ZvjT3KtzVI-T4E7RoLJS0 # 可由 citrus generate reality-keypair 命令生成
    #   short-id:
    #     - 0123456789abcdef
    #   server-names:
    #     - test.com
    #   #下列两个 limit 为选填，可对未通过验证的回落连接限速，bytesPerSec 默认为 0 即不启用
    #   #回落限速是一种特征，不建议启用，如果您是面板/一键脚本开发者，务必让这些参数随机化
    #   limit-fallback-upload:
    #     after-bytes: 0 # 传输指定字节后开始限速
    #     bytes-per-sec: 0 # 基准速率（字节/秒）
    #     burst-bytes-per-sec: 0 # 突发速率（字节/秒），大于 bytesPerSec 时生效
    #   limit-fallback-download:
    #     after-bytes: 0 # 传输指定字节后开始限速
    #     bytes-per-sec: 0 # 基准速率（字节/秒）
    #     burst-bytes-per-sec: 0 # 突发速率（字节/秒），大于 bytesPerSec 时生效
    # ss-option: # like trojan-go's `shadowsocks` config
    #   enabled: false
    #   method: aes-128-gcm # aes-128-gcm/aes-256-gcm/chacha20-ietf-poly1305
    #   password: "example"
    ### 注意，对于trojan listener, 如果 "allow-insecure" 不为 true, 至少需要填写 “certificate和private-key” 或 “shadow-tls” 或 “res-tls” 或 “jls-config” 或 “reality-config” 或 “ss-option” 的其中一项 ###
    # allow-insecure: false # 是否允许不开启tls加密（注意：仅用于有 nginx, caddy 前置的情况）
    # # Real client IP behind a reverse proxy or CDN (ws and grpc only), as for the vless listener above.
    # trusted-proxy-header: "" # header to read real client IP from (e.g. X-Forwarded-For, X-Real-IP, CF-Connecting-IP)
    # trusted-proxies: [loopback] # TCP peers whose header is believed; empty (the default) = never

  - name: hysteria2-in-1
    type: hysteria2
    port: 10820 # 支持使用ports格式，例如200,302 or 200,204,401-429,501-503
    listen: 0.0.0.0
    # routing-mark: 0 # 为监听socket设置routing-mark（仅支持linux）
    # rule: sub-rule-name1 # 默认使用 rules，如果未找到 sub-rule 则直接使用 rules
    # proxy: proxy # 如果不为空则直接将该入站流量交由指定 proxy 处理 (当 proxy 不为空时，这里的 proxy 名称必须合法，否则会出错)
    users:
      00000000-0000-0000-0000-000000000000: PASSWORD_0
      00000000-0000-0000-0000-000000000001: PASSWORD_1
    #  certificate: ./server.crt # 证书 PEM 格式，或者 证书的路径
    #  private-key: ./server.key # 证书对应的私钥 PEM 格式，或者私钥路径
    #  下面两项为mTLS配置项，如果client-auth-type设置为 "verify-if-given" 或 "require-and-verify" 则client-auth-cert必须不为空
    #  client-auth-type: "" # 可选值：""、"request"、"require-any"、"verify-if-given"、"require-and-verify"
    #  client-auth-cert: string # 证书 PEM 格式，或者 证书的路径
    #  如果填写则开启ech（可由 citrus generate ech-keypair <明文域名> 生成）
    #  ech-key: |
    #    -----BEGIN ECH KEYS-----
    #    ACATwY30o/RKgD6hgeQxwrSiApLaCgU+HKh7B6SUrAHaDwBD/g0APwAAIAAgHjzK
    #    madSJjYQIf9o1N5GXjkW4DEEeb17qMxHdwMdNnwADAABAAEAAQACAAEAAwAIdGVz
    #    dC5jb20AAA==
    #    -----END ECH KEYS-----
    ##  up 和 down 均不写或为 0 则使用 BBR 流控
    #  up: "30 Mbps" # 若不写单位，默认为 Mbps
    #  down: "200 Mbps" # 若不写单位，默认为 Mbps
    #  obfs: salamander # 默认为空，如果填写则开启 obfs，目前支持 salamander 和 gecko
    #  obfs-password: yourpassword
    #  obfs-min-packet-size: 512 # 最小线上数据包大小（字节）。仅限 Gecko。
    #  obfs-max-packet-size: 1200 # 最大线上数据包大小（字节）。仅限 Gecko。
    #  bbr-profile: "" # Available: "standard", "conservative", "aggressive". Default: "standard"
    #  max-idle-time: 15000
    #  alpn:
    #    - h3
    #  ignore-client-bandwidth: false
    # HTTP3 服务器认证失败时的行为 （URL 字符串配置）,如果 masquerade 未配置，则返回 404 页
    #  masquerade: file:///var/www # 作为文件服务器
    #  masquerade: http://127.0.0.1:8080	#作为反向代理
    #  masquerade: https://127.0.0.1:8080	#作为反向代理
    #  masquerade-skip-cert-verify: false # https 反向代理默认校验上游证书，仅当上游为自签名证书的本地服务时才显式设为 true (the https upstream is verified by default; set true only for a self-signed local upstream)
    #  realm-opts:
    #    enable: true # 必须手动开启
    #    server-url: https://realm.hy2.io
    #    token: public
    #    realm-id: my-cabin-1f3a8c2e9b
    #    stun-servers:
    #      - stun.nextcloud.com:3478
    #      - stun.sip.us:3478
    #      - global.stun.twilio.com:3478
    #    # proxy: DIRECT # 设置server-url通过哪个代理进行连接
    #    # 下面支持填写针对server-url的TLS配置(sni, skip-cert-verify, name-cert-verify, fingerprint, certificate, private-key, alpn)
    #    # skip-cert-verify： false
    #    # name-cert-verify: example.com # 仅修改证书 DNSName 校验目标，不修改 SNI
    #    # ......

  # 注意，这是用于自建hysteria2入站和出站中realm-opts中server-url的HTTP/HTTPS服务器，请勿混淆
  - name: hysteria2-realm-in-1
    type: hysteria2-realm
    port: 10820 # 支持使用ports格式，例如200,302 or 200,204,401-429,501-503
    listen: 0.0.0.0
    # routing-mark: 0 # 为监听socket设置routing-mark（仅支持linux）
    token: public # hysteria2入站和出站通过 `Authorization: Bearer <token>` 出示的 Bearer 令牌。
    max-realms: 65536 # maximum total realms (0 = unlimited)
    max-realms-per-ip: 4 # maximum realms per client IP (0 = unlimited)
    trusted-proxy-header: "" # header to read real client IP from (e.g. X-Forwarded-For)
    # # TCP peers whose trusted-proxy-header is believed, read from the right like the vless listener.
    # # Empty (the default) = never: as with vless/trojan, the header is ignored and the TCP peer is
    # # the client (a forged header could dodge max-realms-per-ip). Set it when trusted-proxy-header is used.
    # trusted-proxies: [loopback]
    realm-name-pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$" # regex realm names must match
    # # 下面内容如果配置， realm 将通过 TLS 提供 HTTPS 服务；否则提供明文 HTTP
    # certificate: ./server.crt # 证书 PEM 格式，或者 证书的路径
    # private-key: ./server.key # 证书对应的私钥 PEM 格式，或者私钥路径
    # 下面两项为mTLS配置项，如果client-auth-type设置为 "verify-if-given" 或 "require-and-verify" 则client-auth-cert必须不为空
    # client-auth-type: "" # 可选值：""、"request"、"require-any"、"verify-if-given"、"require-and-verify"
    # client-auth-cert: string # 证书 PEM 格式，或者 证书的路径
    # 如果填写则开启ech（可由 citrus generate ech-keypair <明文域名> 生成）
    # ech-key: |
    #   -----BEGIN ECH KEYS-----
    #   ACATwY30o/RKgD6hgeQxwrSiApLaCgU+HKh7B6SUrAHaDwBD/g0APwAAIAAgHjzK
    #   madSJjYQIf9o1N5GXjkW4DEEeb17qMxHdwMdNnwADAABAAEAAQACAAEAAwAIdGVz
    #   dC5jb20AAA==
    #   -----END ECH KEYS-----
    # alpn: ["h2", "http/1.1"]

  - name: trusttunnel-in-1
    type: trusttunnel
    # zero-rtt: false # Applies to HTTP/3; early data can be replayed.
    # Optional plain HTTP cover backend (TLS terminates at this listener).
    # Serve only the cover site here: clients control the forwarded Host.
    # With fallback, HTTP/2 clients must negotiate ALPN h2; prior knowledge
    # HTTP/2 without ALPN is not accepted. Unauthenticated CONNECT cannot tunnel.
    # fallback: 127.0.0.1:8080
    port: 10821 # 支持使用ports格式，例如200,302 or 200,204,401-429,501-503
    listen: 0.0.0.0
    # routing-mark: 0 # 为监听socket设置routing-mark（仅支持linux）
    # rule: sub-rule-name1 # 默认使用 rules，如果未找到 sub-rule 则直接使用 rules
    # proxy: proxy # 如果不为空则直接将该入站流量交由指定 proxy 处理 (当 proxy 不为空时，这里的 proxy 名称必须合法，否则会出错)
    users:
      - username: 1
        password: 9d0cb9d0-964f-4ef6-897d-6c6b3ccf9e68
    certificate: ./server.crt # 证书 PEM 格式，或者 证书的路径
    private-key: ./server.key # 证书对应的私钥 PEM 格式，或者私钥路径
    network: ["tcp", "udp"] # http2+http3
    congestion-controller: bbr
    # bbr-profile: "" # Available: "standard", "conservative", "aggressive". Default: "standard"
    # 下面两项为mTLS配置项，如果client-auth-type设置为 "verify-if-given" 或 "require-and-verify" 则client-auth-cert必须不为空
    # client-auth-type: "" # 可选值：""、"request"、"require-any"、"verify-if-given"、"require-and-verify"
    # client-auth-cert: string # 证书 PEM 格式，或者 证书的路径
    # 如果填写则开启ech（可由 citrus generate ech-keypair <明文域名> 生成）
    # ech-key: |
    #   -----BEGIN ECH KEYS-----
    #   ACATwY30o/RKgD6hgeQxwrSiApLaCgU+HKh7B6SUrAHaDwBD/g0APwAAIAAgHjzK
    #   madSJjYQIf9o1N5GXjkW4DEEeb17qMxHdwMdNnwADAABAAEAAQACAAEAAwAIdGVz
    #   dC5jb20AAA==
    #   -----END ECH KEYS-----

  # 注意，listeners中的tun仅提供给高级用户使用，普通用户应使用顶层配置中的tun
  - name: tun-in-1
    type: tun
    # rule: sub-rule-name1 # 默认使用 rules，如果未找到 sub-rule 则直接使用 rules
    # proxy: proxy # 如果不为空则直接将该入站流量交由指定 proxy 处理 (当 proxy 不为空时，这里的 proxy 名称必须合法，否则会出错)
    stack: mips # gvisor / mixed / system
    dns-hijack:
    - 0.0.0.0:53 # 需要劫持的 DNS
    # auto-detect-interface: false # 自动识别出口网卡
    # auto-route: false # 配置路由表
    # mtu: 9000 # 最大传输单元
    inet4-address: # 必须手动设置 ipv4 地址段
    - 198.19.0.1/30
    inet6-address: # 必须手动设置 ipv6 地址段
    - "fdfe:dcba:9877::1/126"
    # strict-route: true # 将所有连接路由到 tun 来防止泄漏，但你的设备将无法其他设备被访问
    # inet4-route-address: # 启用 auto-route 时使用自定义路由而不是默认路由
    # - 0.0.0.0/1
    # - 128.0.0.0/1
    # inet6-route-address: # 启用 auto-route 时使用自定义路由而不是默认路由
    # - "::/1"
    # - "8000::/1"
    # endpoint-independent-nat: false # 启用独立于端点的 NAT
    # include-uid: # UID 规则仅在 Linux 下被支持，并且需要 auto-route
    # - 0
    # include-uid-range: # 限制被路由的的用户范围
    # - 1000:99999
    # exclude-uid: # 排除路由的的用户
    # - 1000
    # exclude-uid-range: # 排除路由的的用户范围
    # - 1000:99999
    # include-mac-address:
    # - 00:11:22:33:44:55
    # exclude-mac-address:
    # - 00:11:22:33:44:55

    # Android 用户和应用规则仅在 Android 下被支持
    # 并且需要 auto-route

    # include-android-user: # 限制被路由的 Android 用户
    # - 0
    # - 10
    # include-package: # 限制被路由的 Android 应用包名
    # - com.android.chrome
    # exclude-package: # 排除被路由的 Android 应用包名
    # - com.android.captiveportallogin
    # disable-icmp-forwarding: true # 禁用 ICMP 转发，防止某些情况下的 ICMP 环回问题，ping 将不会显示真实的延迟
    # congestion-controller: cubic # TCP congestion controller: cubic, reno, bbr, or bbr3; only effective on mips
# 入口配置与 Listener 等价，传入流量将和 socks,mixed 等入口一样按照 mode 所指定的方式进行匹配处理
# shadowsocks 入口配置（传入流量将和 socks,mixed 等入口一样按照 mode 所指定的方式进行匹配处理）
# ss-config: ss://2022-blake3-aes-256-gcm:vlmpIPSyHH6f4S8WVPdRIHIlzmB+GIRfoH3aNJ/t9Gg=@:23456
# GET /configs shows ss-config and tuic-server with the passwords, tokens and
# keys replaced by "******".

# tuic 服务器入口（传入流量将和 socks,mixed 等入口一样按照 mode 所指定的方式进行匹配处理）
# tuic-server:
#  zero-rtt: false # Opt in only when replayable QUIC early data is acceptable.
#  enable: true
#  listen: 127.0.0.1:10443
#  users:    # 仅支持 TUIC v5（v4 的 token 已不再支持）
#    00000000-0000-0000-0000-000000000000: PASSWORD_0
#    00000000-0000-0000-0000-000000000001: PASSWORD_1
#  certificate: ./server.crt
#  private-key: ./server.key
#  congestion-controller: bbr
#  bbr-profile: "" # Available: "standard", "conservative", "aggressive". Default: "standard"
#  max-idle-time: 15000
#  authentication-timeout: 1000
#  alpn:
#    - h3
#  max-udp-relay-packet-size: 1500
