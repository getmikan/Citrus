# port: 7890 # HTTP(S) 代理服务器端口
# socks-port: 7891 # SOCKS5 代理端口
mixed-port: 10801 # HTTP(S) 和 SOCKS 代理混合端口
# redir-port: 7892 # 透明代理端口，用于 Linux 和 MacOS

# Transparent proxy server port for Linux (TProxy TCP and TProxy UDP)
# tproxy-port: 7893

allow-lan: true # 允许局域网连接
bind-address: "*" # 绑定 IP 地址，仅作用于 allow-lan 为 true，'*'表示所有地址
authentication: # http,socks 入口的验证用户名，密码
  # HTTP (and mixed) check the credentials of every request on a keep-alive
  # connection: a request without them gets 407, a wrong password gets 403 and
  # the connection is closed. Without authentication a Proxy-Authorization
  # header does not set the user (IN-USER). A request header over 64 KiB gets
  # 431 and the connection is closed.
  - "username:password"
skip-auth-prefixes: # 设置跳过验证的 IP 段
  - 127.0.0.1/8
  - ::1/128
lan-allowed-ips: # 允许连接的 IP 地址段，仅作用于 allow-lan 为 true, 默认值为 0.0.0.0/0 和::/0
  - 0.0.0.0/0
  - ::/0
lan-disallowed-ips: # 禁止连接的 IP 地址段，黑名单优先级高于白名单，默认值为空
  - 192.168.0.3/32
# Every config reload (PUT /configs with or without force=true, SIGHUP) applies
# allow-lan, bind-address, skip-auth-prefixes, lan-allowed-ips,
# lan-disallowed-ips, ss-config and tuic-server of the new config. Without
# force=true the built-in port/socks-port/redir-port/tproxy-port/mixed-port
# listeners keep the ports they run on (they are still rebound when allow-lan
# or bind-address changed).

#  find-process-mode has 3 values:always, strict, off
#  - always, 开启，强制匹配所有进程
#  - strict, 默认，由 citrus 判断是否开启
#  - off, 不匹配进程，推荐在路由器上使用此模式
find-process-mode: strict

mode: rule

#自定义 geodata url
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
# Optional: pin the exact file, a database with another SHA-256 is rejected.
geox-sha256:
  geoip: ""   # 64 hex characters
  geosite: ""
  mmdb: ""
  asn: ""

geo-auto-update: false # 是否自动更新 geodata
geo-update-interval: 24 # 更新间隔，单位：小时

# Matcher implementation used by GeoSite, available implementations:
# - succinct (default, same as rule-set)
# - mph (from V2Ray, also `hybrid` in Xray)
# geosite-matcher: succinct

log-level: debug # 日志等级 silent/error/warning/info/debug
# Format of the lines printed to stdout: text (default, key=value as before) or json (one object per line
# with time/level/msg, for Loki, ELK and the like). The controller's /logs stream is not affected.
# log-format: text
# Go time layout of the timestamp in both formats; empty means the default below
# log-timestamp-format: "2006-01-02T15:04:05.000000000Z07:00"

ipv6: true # 开启 IPv6 总开关，关闭阻断所有 IPv6 链接和屏蔽 DNS 请求 AAAA 记录

tls:
  certificate: string # 证书 PEM 格式，或者 证书的路径
  private-key: string # 证书对应的私钥 PEM 格式，或者私钥路径
  # 下面两项为mTLS配置项，如果client-auth-type设置为 "verify-if-given" 或 "require-and-verify" 则client-auth-cert必须不为空
  # client-auth-type: "" # 可选值：""、"request"、"require-any"、"verify-if-given"、"require-and-verify"
  # client-auth-cert: string # 证书 PEM 格式，或者 证书的路径
  # 如果填写则开启ech（可由 citrus generate ech-keypair <明文域名> 生成）
  # ech-key: |
  #   -----BEGIN ECH KEYS-----
  #   ACATwY30o/RKgD6hgeQxwrSiApLaCgU+HKh7B6SUrAHaDwBD/g0APwAAIAAgHjzK
  #   madSJjYQIf9o1N5GXjkW4DEEeb17qMxHdwMdNnwADAABAAEAAQACAAEAAwAIdGVz
  #   dC5jb20AAA==
  #   -----END ECH KEYS-----
  # ech-key 也可以是文件路径；所有监听器的 ech-key 都同时支持以下格式：
  #   - PEM "ECH KEYS"（citrus generate ech-keypair 或 xray tls ech --pem 的输出，"ECH CONFIGS" 块会被忽略）
  #   - Xray echServerKeys：xray tls ech 输出的 "ECH server keys" 纯 base64 字符串，可包含多个密钥
  # ech-key: ACCv2ZuDnZS3qB89E6yLxedT/nYcEtpvUV6kapSPRtfiQgBe/g0AWgAAIAAgOuQ6bS+UBDB93NEEKlQadK0Ob1a+yiIDj/ZOIhJXTDoAJAABAAEAAQACAAEAAwACAAEAAgACAAIAAwADAAEAAwACAAMAAwALZXhhbXBsZS5jb20AAA==
  custom-certifactes:
    - |
      -----BEGIN CERTIFICATE-----
      format/pem...
      -----END CERTIFICATE-----

external-controller: 0.0.0.0:9093 # RESTful API 监听地址
external-controller-tls: 0.0.0.0:9443 # RESTful API HTTPS 监听地址，需要配置 tls 部分配置文件
secret: "123456" # `Authorization:Bearer ${secret}`
# TCP controllers require a secret even on loopback. Plain HTTP is restricted
# to loopback by default, because a remote bearer secret would travel in clear
# text. external-controller-unix and external-controller-pipe may work without
# a secret; external-controller-tls may do so with verified client certificates.
# A tcp/tls controller without a secret only answers requests whose Host is an
# IP address or localhost, and refuses browser requests from other origins
# (Origin header) unless they are listed literally in
# external-controller-cors.allow-origins ("*" does not count).
# PUT /configs applies a changed secret, address, TLS or CORS setting: the
# controller listeners restart and open websocket streams are closed.
# TCP 控制器即使在回环地址也需要 secret；远程明文 HTTP 默认拒绝。
# external-controller-allow-insecure: false # dangerous legacy opt-in: allow secretless TCP or remote plaintext bearer HTTP; env CLASH_OVERRIDE_EXTERNAL_CONTROLLER_ALLOW_INSECURE=true or -ext-ctl-allow-insecure

# WebSocket: POST /auth/ws-ticket with Authorization: Bearer <secret> and
# JSON {"path":"/events?types=auth"}, then connect to that exact path with
# &ticket=<ticket>. Tickets expire after 30 seconds and can be redeemed once.
# Main-secret URLs (?token=<secret>) are rejected by default. For old dashboards only:
# external-controller-allow-legacy-websocket-token: false # true restores the URI-secret risk and emits a warning

# RESTful API CORS标头配置
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true

# RESTful API Unix socket 监听地址（ windows版本大于17063也可以使用，即大于等于1803/RS4版本即可使用 ）
# socket 文件权限默认为 0600，仅运行内核的用户可以连接（Windows 上由所在目录的 ACL 决定）
# 如需允许同组用户访问，可设置环境变量 CITRUS_UNIX_SOCKET_MODE（八进制），例如 CITRUS_UNIX_SOCKET_MODE=0660
# 如果配置了 secret，从 Unix socket 访问同样需要 `Authorization: Bearer ${secret}`
# 测试方法： curl -v --unix-socket "citrus.sock" -H "Authorization: Bearer ${secret}" http://localhost/
external-controller-unix: citrus.sock

# RESTful API Windows namedpipe 监听地址
# 默认仅允许运行内核的用户、SYSTEM 和 Administrators 组访问
# 可通过环境变量 LISTEN_NAMEDPIPE_SDDL 自定义安全描述符，例如允许所有用户读写（不安全）： D:P(A;;GRGW;;;BU)(A;;GA;;;SY)
# 如果配置了 secret，从 namedpipe 访问同样需要 `Authorization: Bearer ${secret}`
external-controller-pipe: \\.\pipe\citrus

# 为 external-controller 和 external-controller-tls 的监听socket设置routing-mark（仅支持linux）
external-controller-routing-mark: 0

# tcp-concurrent: true # TCP 并发连接所有 IP, 将使用最快握手的 TCP

# 按入站用户统计流量（默认开启）。仅统计带认证用户的连接（metadata.InUser 非空），
# 计数为出站侧的有效载荷字节，不含入站协议开销。查询：GET /traffic/users
# Per-user traffic accounting (on by default). Only connections of an authenticated
# inbound user are counted; the counts are payload bytes on the outbound side,
# without the inbound protocol overhead. Query: GET /traffic/users
# user-stats: true

# 按入站用户限制：速度、并发连接数、在线 IP 数、流量配额、到期时间。
# user: "*" 为该入站所有未单独配置用户的默认限制。0 或不写表示不限制。
# 速度单位为字节/秒：10M = 10 MB/s；小写 b 表示比特：80Mbps = 10 MB/s。
# 大小单位：K/M/G/T 为 1000 的幂，Ki/Mi/Gi/Ti 为 1024 的幂。
# speed-group：同名分组的用户（可跨入站）共享同一组速度令牌桶，组内成员应设置相同的 speed-up/speed-down。
# 运行时可通过 /limits/users 修改；重新加载配置会替换 API 设置的限制，配额用量保留。
# Per-user limits of inbound users: speed, concurrent connections, online
# addresses, traffic quota, expiry. user: "*" is the default of every user of
# the inbound without a limit of its own. 0 or absent is no limit.
# speed-up/speed-down are bytes per second: 10M = 10 MB/s; a lowercase b means
# bits: 80Mbps = 10 MB/s. Sizes: K/M/G/T are powers of 1000, Ki/Mi/Gi/Ti of 1024.
# speed-group: the users naming the same group, on any inbounds, share one
# speed (one pair of buckets); give its members the same speed-up/speed-down.
# quota counts upload plus download; expire-at is unix seconds or RFC 3339.
# Runtime API: GET/PUT/DELETE /limits/users, POST /limits/users/reset-quota.
# A reload replaces the limits set through the API; the quota usage is kept.
# user-limits:
#   - { inbound: vless-in, user: alice, speed-up: 10M, speed-down: 80Mbps, max-conns: 64, max-ips: 3, quota: 100G, expire-at: 1767225600 }
#   - { inbound: vless-in, user: "*", speed-down: 20M, max-ips: 2, quota: 50G }

# Prometheus 指标：GET /metrics（在 external-controller 上，需要 secret，Bearer 认证）。
# 默认关闭；开启后按入站统计流量。per-user 输出每个入站用户的序列（基数高，默认关闭）。
# Prometheus metrics: GET /metrics on the external controller, behind the
# secret (bearer authorization). Off by default; when on, the traffic is also
# counted per inbound. per-user adds the series of every inbound user (high
# cardinality, off by default); they are cumulative and not affected by
# GET /traffic/users?reset=true.
# metrics:
#   enable: true
#   per-user: false

# 健康检查 GET /healthz（隧道运行中）与 GET /readyz（配置已应用且所有 listeners 已启动），
# 返回 200 "ok" 或 503。默认需要 secret；true 时这两个路径无需认证（仅返回状态）。
# Health probes: GET /healthz (the tunnel is running) and GET /readyz (the
# configuration is applied and every listener listens), 200 "ok" or 503.
# They require the secret by default; true serves these two paths without it
# (they reveal nothing but the state). The rest of the API keeps the secret.
# health-without-auth: false

# TCP 出站连接建立总期限（毫秒），包含代理握手及重试，默认 5000，取值范围 100-600000。
# 仅影响新连接，不影响已建立连接的读写、UDP 或健康检查。
# 代理适配器内部更短的独立超时仍可能先到期。
# Total budget in milliseconds for a new outbound TCP connection, including the
# proxy handshake and retries. Default 5000, accepted range 100-600000.
# Only new connections are affected; established connections, UDP and health
# checks keep their own timeouts. Shorter adapter-internal deadlines may fire first.
# tcp-connect-timeout: 15000

# 配置 WEB UI 目录，使用 http://{{external-controller}}/ui 访问
external-ui: /path/to/ui/folder/
# external-ui (with external-ui-name) must not be the home directory, the config
# directory, a SAFE_PATHS root or a parent of one of them: the UI update empties
# the folder before installing, and /ui serves it without the secret. Such a
# config (or -ext-ui) is refused; use a subfolder such as ./ui.
external-ui-name: xd
# 目前支持下载zip,tgz格式的压缩包
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
# external-ui-sha256: "..." # required for network downloads unless the dangerous compatibility option below is set
# external-ui-allow-insecure: false # permits an unpinned or plaintext dashboard source; downloaded JS runs on the controller origin

# 在RESTful API端口上开启DOH服务器
# ！！！该URL不会验证secret， 如果开启请自行保证安全问题 ！！！
external-doh-server: /dns-query

# interface-name: en0 # 设置出口网卡

#  TCP keep alive interval
# disable-keep-alive: false #目前在android端强制为true
# keep-alive-idle: 15
# keep-alive-interval: 15

# routing-mark:6666 # 配置 fwmark 仅用于 Linux
experimental:
  # Disable quic-go GSO support. This may result in reduced performance on Linux.
  # This is not recommended for most users.
  # Only users encountering issues with quic-go's internal implementation should enable this,
  # and they should disable it as soon as the issue is resolved.
  # This field will be removed when quic-go fixes all their issues in GSO.
  # This equivalent to the environment variable QUIC_GO_DISABLE_GSO=1.
  #quic-go-disable-gso: true

# 类似于 /etc/hosts, 仅支持配置单个 IP
hosts:
# '*.citrus.dev': 127.0.0.1
# '.dev': 127.0.0.1
# 'alpha.citrus.dev': '::1'
# test.com: [1.1.1.1, 2.2.2.2]
# home.lan: lan # lan 为特别字段，将加入本地所有网卡的地址
# baidu.com: google.com # 只允许配置一个别名

profile: # 存储 select 选择记录
  store-selected: false

  # 持久化 fake-ip
  store-fake-ip: true

# Tun 配置
tun:
  enable: false
  stack: mips # gvisor/mixed/system
  dns-hijack:
    - 0.0.0.0:53 # 需要劫持的 DNS
  # auto-detect-interface: true # 自动识别出口网卡
  # auto-route: true # 配置路由表
  # mtu: 9000 # 最大传输单元
  # gso: false # 启用通用分段卸载，仅支持 Linux
  # gso-max-size: 65536 # 通用分段卸载包的最大大小
  auto-redirect: false # 自动配置 iptables 以重定向 TCP 连接。仅支持 Linux。带有 auto-redirect 的 auto-route 现在可以在路由器上按预期工作，无需干预。
  # strict-route: true # 将所有连接路由到 tun 来防止泄漏，但你的设备将无法其他设备被访问
  # disable-icmp-forwarding: true # 禁用 ICMP 转发，防止某些情况下的 ICMP 环回问题，ping 将不会显示真实的延迟
  # congestion-controller: cubic # TCP congestion controller: cubic, reno, bbr, or bbr3; only effective on mips
  route-address-set: # 将指定规则集中的目标 IP CIDR 规则添加到防火墙, 不匹配的流量将绕过路由, 仅支持 Linux，且需要 nftables，`auto-route` 和 `auto-redirect` 已启用。
    - ruleset-1
    - ruleset-2
  route-exclude-address-set: # 将指定规则集中的目标 IP CIDR 规则添加到防火墙, 匹配的流量将绕过路由, 仅支持 Linux，且需要 nftables，`auto-route` 和 `auto-redirect` 已启用。
    - ruleset-3
    - ruleset-4
  route-address: # 启用 auto-route 时使用自定义路由而不是默认路由
    - 0.0.0.0/1
    - 128.0.0.0/1
    - "::/1"
    - "8000::/1"
  # inet4-route-address: # 启用 auto-route 时使用自定义路由而不是默认路由（旧写法）
  #   - 0.0.0.0/1
  #   - 128.0.0.0/1
  # inet6-route-address: # 启用 auto-route 时使用自定义路由而不是默认路由（旧写法）
  #   - "::/1"
  #   - "8000::/1"
  # endpoint-independent-nat: false # 启用独立于端点的 NAT
  # include-interface: # 限制被路由的接口。默认不限制，与 `exclude-interface` 冲突
  #   - "lan0"
  # exclude-interface: # 排除路由的接口，与 `include-interface` 冲突
  #   - "lan1"
  # include-uid: # UID 规则仅在 Linux 下被支持，并且需要 auto-route
  # - 0
  # include-uid-range: # 限制被路由的的用户范围
  # - 1000:9999
  # exclude-uid: # 排除路由的的用户
  #- 1000
  # exclude-uid-range: # 排除路由的的用户范围
  # - 1000:9999
  # include-mac-address:
  # - 00:11:22:33:44:55
  # exclude-mac-address:
  # - 00:11:22:33:44:55

  # Android 用户和应用规则仅在 Android 下被支持
  # 并且需要 auto-route

  # include-android-user: # 限制被路由的 Android 用户
  # - 0
  # - 10
  # include-package: # 限制被路由的 Android 应用包名
  # - com.android.chrome
  # exclude-package: # 排除被路由的 Android 应用包名
  # - com.android.captiveportallogin

# 嗅探域名 可选配置
sniffer:
  enable: false
  ## 对 redir-host 类型识别的流量进行强制嗅探
  ## 如：Tun、Redir 和 TProxy 并 DNS 为 redir-host 皆属于
  # force-dns-mapping: false
  ## 对所有未获取到域名的流量进行强制嗅探
  # parse-pure-ip: false
  # 是否使用嗅探结果作为实际访问，默认 true
  # 全局配置，优先级低于 sniffer.sniff 实际配置
  override-destination: false
  # TCP destinations (ip:port) whose domain sniffing failed more than this many times are not sniffed
  # for 10 minutes; 0-254, -1 never skips, default 5. force-domain connections are always sniffed.
  # skip-threshold: 5
  sniff: # TLS 和 QUIC 默认如果不配置 ports 默认嗅探 443
    QUIC:
    #  ports: [ 443 ]
    TLS:
    #  ports: [443, 8443]

    # 识别 BitTorrent 流量，供 PROTOCOL,bittorrent 规则匹配
    # Detects BitTorrent traffic for the PROTOCOL,bittorrent rule
    #   TCP: 对等端握手 (BEP 3) / the peer handshake
    #   UDP: uTP 建连 ST_SYN (BEP 29)、DHT 消息 (BEP 5)、UDP Tracker connect (BEP 15)
    #        uTP ST_SYN, DHT (KRPC) messages, the UDP tracker connect request
    # 不产生域名，从不修改目标地址，只把连接标记为 bittorrent；
    # 不受 parse-pure-ip / force-domain 等条件限制，仅遵循 skip-src-address / skip-dst-address
    # Reports no domain and never overrides the destination. Runs on every
    # connection not exempted by skip-src-address / skip-dst-address,
    # regardless of parse-pure-ip, force-dns-mapping or force-domain.
    #
    # UDP: 同一 NAT 会话（同一源地址）中每个新目标的前 8 个包都会被检测；一旦识别，
    # 整个会话（以及之后 5 分钟内来自同一源端口的新会话）都标记为 bittorrent，
    # 每个目标按规则重新匹配，结果为 REJECT / REJECT-DROP 的包被丢弃。
    # 会话的出站在第一个包时已确定，其他目标（如 DIRECT 或代理）无法中途切换。
    # UDP: the first 8 packets to every new destination of a NAT session are
    # inspected. Once recognised, the whole session (and new sessions from the
    # same source port for 5 minutes) is tagged, each destination is matched
    # again, and packets whose rule resolves to REJECT / REJECT-DROP are
    # dropped. The outbound of a session is fixed by its first packet, so a
    # target other than REJECT cannot be applied midway.
    #
    # TCP: 最多等待客户端数据 300ms，超时则不标记直接放行；默认端口为 1-65535，
    # 但排除服务器先发言的常用端口 21,22,23,25,110,119,143,587,3306,5900
    # TCP: waits at most 300 ms for client data, then lets the connection
    # through untagged. Default ports: 1-65535 minus the well-known
    # server-first ports 21,22,23,25,110,119,143,587,3306,5900.
    #
    # 注意：启用 MSE/PE 协议加密的 BitTorrent TCP 连接无法识别（握手已被加密），
    # 若需完整拦截请同时拦截 UDP（DHT/uTP/Tracker）。
    # Caveat: BitTorrent over TCP with MSE/PE (protocol encryption) is not
    # detectable, the handshake itself is encrypted. Blocking the UDP side
    # (DHT, uTP, trackers) is what cuts most clients off.
    # BitTorrent:
    #  ports: [1-20, 24, 26-109, 111-118, 120-142, 144-586, 588-3305, 3307-5899, 5901-65535]

    # 默认嗅探 80
    HTTP: # 需要嗅探的端口
      ports: [80, 8080-8880]
      # 可覆盖 sniffer.override-destination
      override-destination: true
  force-domain:
    - +.v2ex.com
  # skip-src-address: # 对于来源ip跳过嗅探
  #   - 192.168.0.3/32
  # skip-dst-address: # 对于目标ip跳过嗅探
  #   - 192.168.0.3/32
  ## 对嗅探结果进行跳过
  # skip-domain:
  #   - Mijia Cloud
  # 需要嗅探协议
  # 已废弃，若 sniffer.sniff 配置则此项无效
  sniffing:
    - tls
    - http
  # 强制对此域名进行嗅探

  # 仅对白名单中的端口进行嗅探，默认为 443，80
  # 已废弃，若 sniffer.sniff 配置则此项无效
  port-whitelist:
    - "80"
    - "443"
    # - 8000-9999

tunnels: # one line config
  - tcp/udp,127.0.0.1:6553,114.114.114.114:53,proxy
  - tcp,127.0.0.1:6666,rds.mysql.com:3306,vpn
  # full yaml config
  - network: [tcp, udp]
    address: 127.0.0.1:7777
    target: target.com
    proxy: proxy

# DNS 配置
dns:
  cache-algorithm: arc
  # 是否允许返回过期缓存，默认 true（与原有行为相同：立即返回过期记录并在后台刷新，不限制过期时长）
  # Serve expired cache entries (like unbound serve-expired, RFC 8767). Default true with
  # ttl 0 and client timeout 0, which is the resolver's existing behaviour: an expired entry
  # is answered at once with TTL 1 and refreshed in the background, with no age limit.
  # RFC 8767 style, e.g.: serve-expired-ttl: 86400, serve-expired-client-timeout: 1800
  # (wait up to 1.8 s for a fresh answer, serve stale only on timeout or upstream failure).
  # serve-expired: false never answers stale: an expired entry is resolved before answering.
  serve-expired: true
  # 过期缓存的最大可复用时间，单位：秒；默认 0（不限制），最大 2592000
  # How long after expiry an entry may still be served, seconds. Default 0 = no limit, max 2592000 (30 days).
  serve-expired-ttl: 0
  # 返回过期缓存前等待上游解析的时间，单位：毫秒；默认 0（立即返回），最大 5000
  # How long to wait for the upstream before answering stale, milliseconds. Default 0 = answer at once, max 5000.
  serve-expired-client-timeout: 0
  enable: false # 关闭将使用系统 DNS
  prefer-h3: false # 是否开启 DoH 支持 HTTP/3，将并发尝试
  listen: 0.0.0.0:53 # 开启 DNS 服务器监听
  # ipv6: false # false 将返回 AAAA 的空结果
  # ipv6-timeout: 300 # 单位：ms，内部双栈并发时，向上游查询 AAAA 时，等待 AAAA 的时间，默认 100ms
  # 用于解析 nameserver，fallback 以及其他 DNS 服务器配置的，DNS 服务域名
  # 只能使用纯 IP 地址，可使用加密 DNS
  default-nameserver:
    - 114.114.114.114
    - 8.8.8.8
    - tls://1.12.12.12:853
    - tls://223.5.5.5:853
    - system # append DNS server from system configuration. If not found, it would print an error log and skip.
  enhanced-mode: fake-ip # or redir-host

  fake-ip-range: 198.18.0.1/16 # fake-ip 池设置
  # fake-ip-range6: fdfe:dcba:9876::1/64 # fake-ip6 池设置
  # Names whose labels hold bytes no host name can (a dot, a space, a non-ASCII byte: \. \032 \152 in logs)
  # never get a fake IP, they are resolved as usual and usually end in NXDOMAIN

  # 配置不使用 fake-ip 的域名
  fake-ip-filter:
    - '*.lan'
    - localhost.ptlogin2.qq.com
    # fakeip-filter 为 rule-providers 中的名为 fakeip-filter 规则订阅，
    # 且 behavior 必须为 domain/classical，当为 classical 时仅会生效域名类规则
    - rule-set:fakeip-filter
    # fakeip-filter 为 geosite 中名为 fakeip-filter 的分类（需要自行保证该分类存在）
    - geosite:fakeip-filter

    # 当 fake-ip-filter-mode: rule 时开启规则模式
    # fake-ip 与路由 rules 匹配逻辑一致(自上而下)，语法也一致，支持GEOSITE、RuleSet、DOMAIN*、MATCH
    - RULE-SET,reject-domain,fake-ip # 自定义 RuleSet behavior 必须为 domain/classical，当为 classical 时仅会生效域名类规则
    - RULE-SET,proxy-domain,fake-ip
    - GEOSITE,gfw,fake-ip
    - DOMAIN,www.baidu.com,real-ip
    - DOMAIN-SUFFIX,qq.com,real-ip
    - DOMAIN-SUFFIX,jd.com,fake-ip
    - MATCH,fake-ip # 最后 fake-ip or real-ip

  # 配置fake-ip-filter的匹配模式，默认为blacklist，即如果匹配成功不返回fake-ip
  # 可设置为whitelist，即只有匹配成功才返回fake-ip
  # 也可配置为rule，规则模式语法见fake-ip-filter说明
  fake-ip-filter-mode: blacklist
  # 配置fakeip查询返回的TTL，非必要情况下请勿修改
  fake-ip-ttl: 1

  # use-hosts: true # 查询 hosts

  # 配置后面的nameserver、fallback和nameserver-policy向dns服务器的连接过程是否遵守遵守rules规则
  # 如果为false（默认值）则这三部分的dns服务器在未特别指定的情况下会直连
  # 如果为true，将会按照rules的规则匹配链接方式（走代理或直连），如果有特别指定则任然以指定值为准
  # 仅当proxy-server-nameserver非空时可以开启此选项, 强烈不建议和prefer-h3一起使用
  # 此外，这三者配置中的dns服务器如果出现域名会采用default-nameserver配置项解析，也请确保正确配置default-nameserver
  respect-rules: false

  # DNS 主要域名配置
  # 支持 UDP，TCP，DoT，DoH，DoQ
  # 这部分为主要 DNS 配置，影响所有直连，确保使用对大陆解析精准的 DNS
  nameserver:
    - 114.114.114.114 # default value
    - 8.8.8.8 # default value
    - tls://223.5.5.5:853 # DNS over TLS
    - https://doh.pub/dns-query # DNS over HTTPS
    - https://dns.alidns.com/dns-query#h3=true # 强制 HTTP/3，与 perfer-h3 无关，强制开启 DoH 的 HTTP/3 支持，若不支持将无法使用
    - https://mozilla.cloudflare-dns.com/dns-query#DNS&h3=true # 指定策略组和使用 HTTP/3
    - dhcp://en0 # dns from dhcp
    - quic://dns.adguard.com:784 # DNS over QUIC
    # DNSCrypt v2 (sdns:// DNS stamp, protocol 0x01 only; DoH/DoT/DoQ stamps are rejected, use https:// / tls:// / quic://)
    # 支持 #ProxyGroupName / #en0 等参数，证书查询与加密查询都走同一出口；响应被截断 (TC) 时自动改用 TCP 重试
    # - sdns://AQMAAAAAAAAAEzE0OS4xMTIuMTEyLjEwOjg0NDMgZ8hHuMh1jNEgJFVDvnVnRt803x2EwAuMRwNo34Idhj4ZMi5kbnNjcnlwdC1jZXJ0LnF1YWQ5Lm5ldA # Quad9
    # - 'sdns://AQMAAAAAAAAAEzE0OS4xMTIuMTEyLjEwOjg0NDMgZ8hHuMh1jNEgJFVDvnVnRt803x2EwAuMRwNo34Idhj4ZMi5kbnNjcnlwdC1jZXJ0LnF1YWQ5Lm5ldA#DNS'
    # - ts://tailscale # 使用指定 Tailscale 出站的 DNS 配置查询
    # - et://easytier # 仅解析 overlay A/PTR；建议放在 nameserver-policy
    # - '8.8.8.8#RULES' # 效果同respect-rules，但仅对该服务器生效
    # - '8.8.8.8#en0' # 兼容指定 DNS 出口网卡

  # 当配置 fallback 时，会查询 nameserver 中返回的 IP 是否为 CN，非必要配置
  # 当不是 CN，则使用 fallback 中的 DNS 查询结果
  # 确保配置 fallback 时能够正常查询
  # fallback:
  #   - tcp://1.1.1.1
  #   - 'tcp://1.1.1.1#ProxyGroupName' # 指定 DNS 过代理查询，ProxyGroupName 为策略组名或节点名，过代理配置优先于配置出口网卡，当找不到策略组或节点名则设置为出口网卡

  # 专用于节点域名解析的 DNS 服务器，非必要配置项，如果不填则遵循nameserver-policy、nameserver和fallback的配置
  # proxy-server-nameserver:
  #   - https://doh.pub/dns-query
  #   - tls://223.5.5.5:853
  # proxy-server-nameserver-policy: # 格式同nameserver-policy，仅用于节点域名解析，当且仅当proxy-server-nameserver不为空时生效
  #   'www.yournode.com': '114.114.114.114'

  # 专用于direct出口域名解析的 DNS 服务器，非必要配置项，如果不填则遵循nameserver-policy、nameserver和fallback的配置
  # direct-nameserver:
  #   - system://
  # direct-nameserver-follow-policy: false # 是否遵循nameserver-policy，默认为不遵守，仅当direct-nameserver不为空时生效

  # 配置 fallback 使用条件
  # fallback-filter:
  #   geoip: true    # 配置是否使用 geoip
  #   geoip-code: CN # 当 nameserver 解析出域名的 IP 查询 geoip 库为 CN 时， 使用 nameserver 中的 DNS 查询结果
  #   ipcidr:        # 当 nameserver 解析出域名的 IP 匹配 ipcidr 时，使用 fallback 中的 DNS 查询结果
  #     - 240.0.0.0/4
  #     - 0.0.0.0/32
  #     - 127.0.0.1/32
  #     - 100.64.0.0/10
  #   domain:        # 匹配到这些域名，会直接使用 fallback 解析，不去使用 nameserver
  #     - '+.google.com'
  #     - '+.facebook.com'
  #     - '+.youtube.com'
  #   geosite:       # 匹配到这些域名，会直接使用 fallback 解析，不去使用 nameserver（已废弃，请使用 nameserver-policy）
  #     - gfw
  # fallback-lazy-query: false # 默认值为 false ，如果为 true 会先判断来自 nameserver 的结果是否满足 fallback-filter 后再发起查询

  # 配置查询域名使用的 DNS 服务器
  nameserver-policy:
    #   'www.baidu.com': '114.114.114.114'
    #   '+.internal.crop.com': '10.0.0.1'
    "geosite:cn,private,apple":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:category-ads-all": rcode://success
    "www.baidu.com,+.google.cn": [223.5.5.5, https://dns.alidns.com/dns-query]
    ## global，dns 为 rule-providers 中的名为 global 和 dns 规则订阅，
    ## 且 behavior 必须为 domain/classical，当为 classical 时仅会生效域名类规则
    # "rule-set:global,dns": 8.8.8.8

proxies: # socks5
  - name: "socks"
    type: socks5
    server: server
    port: 443
    # username: username
    # password: password
    # tls: true
    # fingerprint: xxxx # 配置指纹将实现 SSL Pining 效果, 可使用 openssl x509 -noout -fingerprint -sha256 -inform pem -in yourcert.pem 获取，可用逗号分隔多个 (任一匹配即可)
    # 下面两项如果填写则开启 mTLS（需要同时填写）
    # certificate: ./client.crt # 证书 PEM 格式，或者 证书的路径
    # private-key: ./client.key # 证书对应的私钥 PEM 格式，或者私钥路径
    # skip-cert-verify: true
    # name-cert-verify: example.com # 仅修改证书 DNSName 校验目标，不修改 SNI，可用逗号分隔多个 (任一匹配即可)
    # udp: true
    # ip-version: ipv6

  # http
  - name: "http"
    type: http
    server: server
    port: 443
    # username: username
    # password: password
    # tls: true # https
    # skip-cert-verify: true
    # name-cert-verify: example.com # 仅修改证书 DNSName 校验目标，不修改 SNI
    # sni: custom.com
    # fingerprint: xxxx # 配置指纹将实现 SSL Pining 效果, 可使用 openssl x509 -noout -fingerprint -sha256 -inform pem -in yourcert.pem 获取
    # 下面两项如果填写则开启 mTLS（需要同时填写）
    # certificate: ./client.crt # 证书 PEM 格式，或者 证书的路径
    # private-key: ./client.key # 证书对应的私钥 PEM 格式，或者私钥路径
    # ip-version: dual

  # Snell
  - name: "snell"
    type: snell
    server: server
    port: 44046
    psk: yourpsk
    # version: 4 # support 1/2/3/4/5
    # udp: true # support UDP on version 3/4/5
    # reuse: false # v4/5 only
    # obfs-opts:
    #   mode: http # or tls/shadow-tls/restls/jls

  - name: "snell-shadow-tls"
    type: snell
    server: server
    port: 44046
    psk: yourpsk
    # version: 4 # support 1/2/3/4/5
    # udp: true # support UDP on version 3/4/5
    # reuse: false # v4/5 only
    # client-fingerprint: chrome
    obfs-opts:
      mode: shadow-tls
      host: bing.com
      password: "shadow_tls_password"
      version: 2 # support 1/2/3
      alpn: ["h2","http/1.1"]

  - name: "snell-restls"
    type: snell
    server: server
    port: 44046
    psk: yourpsk
    # version: 4 # support 1/2/3/4/5
    # client-fingerprint: chrome
    obfs-opts:
      mode: restls
      host: bing.com
      password: "restls_password"
      version-hint: tls13

  - name: "snell-jls"
    type: snell
    server: server
    port: 44046
    psk: yourpsk
    # version: 4 # support 1/2/3/4/5
    # client-fingerprint: chrome
    obfs-opts:
      mode: jls
      host: bing.com
      username: jls-user
      password: "jls_password"

  # Shadowsocks
  # cipher支持:
  #   aes-128-gcm aes-192-gcm aes-256-gcm
  #   chacha20-ietf-poly1305 xchacha20-ietf-poly1305
  #   2022-blake3-aes-128-gcm 2022-blake3-aes-256-gcm 2022-blake3-chacha20-poly1305
  #   none
  # 不再支持旧的 stream 加密（rc4-md5、aes-*-cfb、aes-*-ctr、chacha20、chacha20-ietf、xchacha20）
  - name: "ss1"
    type: ss
    server: server
    port: 443
    cipher: chacha20-ietf-poly1305
    password: "password"
    # udp: true
    # udp-over-tcp: false
    # ip-version: ipv4 # 设置节点使用 IP 版本，可选：dual，ipv4，ipv6，ipv4-prefer，ipv6-prefer。默认使用 dual
    # ipv4：仅使用 IPv4  ipv6：仅使用 IPv6
    # ipv4-prefer：优先使用 IPv4 对于 TCP 会进行双栈解析，并发链接但是优先使用 IPv4 链接，
    # UDP 则为双栈解析，获取结果中的第一个 IPv4
    # ipv6-prefer 同 ipv4-prefer
    # 现有协议都支持此参数，TCP 效果仅在开启 tcp-concurrent 生效
    smux:
      enabled: false
      protocol: smux # smux/yamux/h2mux
      # max-connections: 4 # Maximum connections. Conflict with max-streams.
      # min-streams: 4 # Minimum multiplexed streams in a connection before opening a new connection. Conflict with max-streams.
      # max-streams: 0 # Maximum multiplexed streams in a connection before opening a new connection. Conflict with max-connections and min-streams.
      # padding: false # Enable padding. Requires sing-box server version 1.3-beta9 or later.
      # statistic: false # 控制是否将底层连接显示在面板中，方便打断底层连接
      # only-tcp: false # 如果设置为 true, smux 的设置将不会对 udp 生效，udp 连接会直接走底层协议

  - name: "ss2"
    type: ss
    server: server
    port: 443
    cipher: chacha20-ietf-poly1305
    password: "password"
    plugin: obfs
    plugin-opts:
      mode: tls # or http
      # host: bing.com

  - name: "ss4-shadow-tls"
    type: ss
    server: server
    port: 443
    cipher: chacha20-ietf-poly1305
    password: "password"
    plugin: shadow-tls
    client-fingerprint: chrome
    plugin-opts:
      host: "cloud.tencent.com"
      password: "shadow_tls_password"
      version: 2 # support 1/2/3
      # alpn: ["h2","http/1.1"]

  - name: "ss5"
    type: ss
    server: server
    port: 443
    cipher: chacha20-ietf-poly1305
    password: "password"
    plugin: gost-plugin
    plugin-opts:
      mode: websocket
      # tls: true # wss
      # fingerprint: xxxx # 配置指纹将实现 SSL Pining 效果, 可使用 openssl x509 -noout -fingerprint -sha256 -inform pem -in yourcert.pem 获取
      # 下面两项如果填写则开启 mTLS（需要同时填写）
      # certificate: ./client.crt # 证书 PEM 格式，或者 证书的路径
      # private-key: ./client.key # 证书对应的私钥 PEM 格式，或者私钥路径
      # skip-cert-verify: true
      # name-cert-verify: example.com # 仅修改证书 DNSName 校验目标，不修改 SNI
      # host: bing.com
      # path: "/"
      # mux: true
      # headers:
      #   custom: value

  - name: "ss-jls"
    type: ss
    server: server
    port: 443
    cipher: chacha20-ietf-poly1305
    password: "password"
    plugin: jls
    client-fingerprint: chrome
    plugin-opts:
      host: "www.example.com"
      username: "jls-user"
      password: "jls-password"
      # alpn: [h2, http/1.1]

  - name: "gost-relay-hop"
    type: gost-relay
    # Dynamic mode: relay connects to the target address requested by the upper proxy.
    # Use this proxy through dialer-proxy to carry ss/vless/trojan/etc.
    server: relay.example.com
    port: 443
    udp: true
    tls: true
    # mux: true # relay+mtls when tls is also true
    # sni: relay.example.com
    # username: user
    # password: pass
    # client-fingerprint: chrome
    # fingerprint: xxxx
    # certificate: ./client.crt
    # private-key: ./client.key
    # skip-cert-verify: true
    # name-cert-verify: example.com # 仅修改证书 DNSName 校验目标，不修改 SNI

  - name: "ss6-gost-relay"
    type: ss
    # This address is dialed from the remote GOST relay server side.
    # If the remote SS listens on 127.0.0.1:12345 on the relay server, write it here.
    server: 127.0.0.1
    port: 12345
    cipher: chacha20-ietf-poly1305
    password: "password"
    udp: true
    # udp-over-tcp: true # use this instead if your SS server expects UoT over TCP
    dialer-proxy: gost-relay-hop

  # - name: "gost-relay-forward-hop"
  #   type: gost-relay
  #   # Forward mode: relay server chooses its configured forwarding target.
  #   server: relay.example.com
  #   port: 443
  #   udp: true
  #   forward: true
  #   tls: true
  #   # mux: true
  #   # sni: relay.example.com
  #   # username: user
  #   # password: pass
  #
  # - name: "ss6-gost-relay-forward"
  #   type: ss
  #   # In forward mode this address is only used to ask dialer-proxy for a stream.
  #   # The GOST relay server forwards the stream to its configured target.
  #   server: relay.example.com
  #   port: 443
  #   cipher: chacha20-ietf-poly1305
  #   password: "password"
  #   udp: true
  #   dialer-proxy: gost-relay-forward-hop

  - name: "ss-restls-tls13"
    type: ss
    server: [YOUR_SERVER_IP]
    port: 443
    cipher: chacha20-ietf-poly1305
    password: [YOUR_SS_PASSWORD]
    client-fingerprint:
      chrome # One of: chrome, ios, firefox or safari
      # 可以是 chrome, ios, firefox, safari 中的一个
    plugin: restls
    plugin-opts:
      host:
        "www.microsoft.com" # Must be a TLS 1.3 server
        # 应当是一个 TLS 1.3 服务器
      password: [YOUR_RESTLS_PASSWORD]
      version-hint: "tls13"
      # Control your post-handshake traffic through restls-script
      # Hide proxy behaviors like "tls in tls".
      # see https://github.com/3andne/restls/blob/main/Restls-Script:%20Hide%20Your%20Proxy%20Traffic%20Behavior.md
      # 用 restls 剧本来控制握手后的行为，隐藏"tls in tls"等特征
      # 详情：https://github.com/3andne/restls/blob/main/Restls-Script:%20%E9%9A%90%E8%97%8F%E4%BD%A0%E7%9A%84%E4%BB%A3%E7%90%86%E8%A1%8C%E4%B8%BA.md
      restls-script: "300?100<1,400~100,350~100,600~100,300~200,300~100"

  - name: "ss-restls-tls12"
    type: ss
    server: [YOUR_SERVER_IP]
    port: 443
    cipher: chacha20-ietf-poly1305
    password: [YOUR_SS_PASSWORD]
    client-fingerprint:
      chrome # One of: chrome, ios, firefox or safari
      # 可以是 chrome, ios, firefox, safari 中的一个
    plugin: restls
    plugin-opts:
      host:
        "vscode.dev" # Must be a TLS 1.2 server
        # 应当是一个 TLS 1.2 服务器
      password: [YOUR_RESTLS_PASSWORD]
      version-hint: "tls12"
      restls-script: "1000?100<1,500~100,350~100,600~100,400~200"

  - name: "ss-kcptun"
    type: ss
    server: [YOUR_SERVER_IP]
    port: 443
    cipher: chacha20-ietf-poly1305
    password: [YOUR_SS_PASSWORD]
    plugin: kcptun
    plugin-opts:
      key: it's a secrect # pre-shared secret between client and server
      crypt: aes # aes, aes-128, aes-128-gcm, aes-192, salsa20, blowfish, twofish, cast5, 3des, tea, xtea, xor, none, null
      mode: fast # profiles: fast3, fast2, fast, normal, manual
      conn: 1 # set num of UDP connections to server
      autoexpire: 0 # set auto expiration time(in seconds) for a single UDP connection, 0 to disable
      scavengettl: 600 # set how long an expired connection can live (in seconds)
      mtu: 1350 # set maximum transmission unit for UDP packets
      ratelimit: 0 # set maximum outgoing speed (in bytes per second) for a single KCP connection, 0 to disable. Also known as packet pacing
      sndwnd: 128 # set send window size(num of packets)
      rcvwnd: 512 # set receive window size(num of packets)
      datashard: 10 # set reed-solomon erasure coding - datashard
      parityshard: 3 # set reed-solomon erasure coding - parityshard
      dscp: 0 # set DSCP(6bit)
      nocomp: false # disable compression
      acknodelay: false # flush ack immediately when a packet is received
      nodelay: 0
      interval: 50
      resend: 0
      sockbuf: 4194304 # per-socket buffer in bytes
      smuxver: 1 # specify smux version, available 1,2
      smuxbuf: 4194304 # the overall de-mux buffer in bytes
      framesize: 8192 # smux max frame size
      streambuf: 2097152 # per stream receive buffer in bytes, smux v2+
      keepalive: 10 # seconds between heartbeats

  # vless
  - name: "vless-tcp"
    type: vless
    server: server
    port: 443
    uuid: uuid
    network: tcp
    servername: example.com # AKA SNI
    # skip-cert-verify: true
