  # tailscale
  - name: "tailscale"
    type: tailscale
    # hostname: citrus # Tailscale 设备名，默认由 tsnet 处理
    # auth-key: tskey-auth-xxxx # 可选；不填写时首次启动会输出交互式登录 URL
    # control-url: https://controlplane.tailscale.com # 可选；自定义 Headscale/Tailscale control server
    # state-dir: ./tailscale # tsnet 状态目录，默认 tailscale
    # ephemeral: false # 是否作为 ephemeral node 登录，默认 false
    udp: true # 是否启用 UDP，默认 false
    # accept-routes: true # 是否接受 Tailnet 中发布的 subnet routes
    # exit-node: 100.64.0.1 # 使用指定 exit node，可填写节点 IP；也支持 auto:any
    # exit-node-allow-lan-access: true # 使用 exit node 时是否允许访问本地 LAN
    # 当目标不在 Tailscale 路由内时，连接会直接报错，不会回退到直连；
    # 访问公网需要配置可用的 exit-node，或接受覆盖目标网段的 subnet routes。
    # 一个出站代理的标识。当值不为空时，Tailscale 控制面与 DERP 连接（TCP/HTTPS）经由指定的 proxy 发出；
    # 此时不打开任何本地 UDP 套接字（不直连对端、不做 STUN/端口映射、不发 ICMP 探测），
    # 所有对端流量都经 DERP 中继，延迟与吞吐不如直连，但不会有流量绕过该 proxy。
    # 经 tailscale 转发到非 tailnet 上游的纯 UDP DNS 查询也会失败（MagicDNS 名称不受影响）。
    # dialer-proxy: the control plane and DERP (TCP/HTTPS) go through this proxy.
    # No local UDP socket is opened then (no direct peer paths, STUN, port
    # mapping or ICMP probes), so all peer traffic is relayed by DERP: higher
    # latency and lower throughput than a direct path, but nothing goes around
    # the proxy. Plain UDP DNS that tailscale forwards to non-tailnet upstreams
    # fails too (MagicDNS names are not affected).
    # dialer-proxy: "ss1"
    # interface-name: "WLAN" # 指定出站网卡
    # routing-mark: 6666 # Linux 下配置 fwmark
    # ip-version: ipv4-prefer # 可选：dual/ipv4/ipv6/ipv4-prefer/ipv6-prefer

  # zerotier
  - name: "zerotier"
    type: zerotier
    network: "0123456789abcdef" # 16-digit ZeroTier network ID
    # state-dir: ./zerotier-node # persistent node state and default identity; defaults to an isolated directory derived from network and outbound name
    # identity-secret: "0123456789:0:public-key:private-key" # complete identity.secret contents; overrides the identity in state-dir and is not written there
    # planet: ./planet # optional private planet file; replaces the built-in Earth planet
    # mtu: 1400 # optional local MTU override; cannot exceed the controller MTU
    # physical-mtu: 1432 # optional ZeroTier UDP payload MTU (510-10324; default 1432)
    # ip-stack:
    #   mode: auto # options: auto, mips, gvisor; auto uses citrus IP stack (MIPS), gvisor needs compiled with -tags with_gvisor
    #   congestion-controller: cubic # TCP congestion controller: cubic, reno, bbr, or bbr3; ignored by gVisor
    # primary-port: 0 # primary UDP port; 0 selects an available port
    # secondary-port: 0 # second UDP port; 0 selects an available port, -1 disables it
    # tcp-fallback-mode: auto # auto uses relay after UDP failure; force uses relay only; disable turns relay off
    # tcp-fallback-relay: 204.80.128.1:443
    # remote-trace-target: "0123456789" # optional node ID receiving global diagnostic traces
    # remote-trace-level: 0 # 0 normal, 10 verbose, 15 rules, 20 debug, 30 insane
    # low-bandwidth: false # reduce background traffic and network configuration refresh frequency
    # encrypted-hello: false # use protocol-13 extended encryption for outgoing HELLO packets
    # orbit: # optional federated root worlds (moons)
    #   - world: "0123456789abcdef" # 16-digit moon world ID
    #     seed: "0123456789" # 10-digit node ID of one moon root
    udp: true
    # remote-dns-resolve: true # resolve destination names through ZeroTier using controller-provided DNS servers
    # dns: [10.147.17.1] # optional override for controller-provided DNS servers
    # dialer-proxy: "ss1" # carry ZeroTier wire traffic through another outbound
    # interface-name: "WLAN"
    # routing-mark: 6666
    # ip-version: ipv4-prefer

