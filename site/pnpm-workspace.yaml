allowBuilds:
  # esbuild ships its binary as an optional dependency; its install script only checks it.
  esbuild: false
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.12.0'
  - '@astrojs/markdown-satteri@0.4.3'
  - astro@7.3.6
overrides:
  # postcss-nested 6 (via @expressive-code/core) still asks for v6; 7.1.6 fixes
  # the quadratic selector parsing advisory.
  postcss-selector-parser: ^7.1.6
